<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Innerspeaker - Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Permanent+Marker&family=Inter:wght@200;300;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0d1b1a; 
            --leaf-green: #4b6a4a;
            --autumn-orange: #c87c4a;
            --text-off: #e8e4d9;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-deep);
            color: var(--text-off);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .grain {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.15; pointer-events: none; z-index: 50;
        }

        .bg-layer {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 100%, var(--autumn-orange) -20%, var(--leaf-green) 40%, var(--bg-deep) 90%);
            z-index: -2;
            transition: opacity 1.5s ease;
            background-size: cover;
            background-position: center;
        }

        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -3;
            transform: translateX(-50%) translateY(-50%);
            object-fit: cover;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .tree {
            position: absolute;
            width: 120px; height: 120px;
            color: rgba(20, 40, 30, 0.4);
            transform-origin: center;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes zoomTree {
            0% { transform: scale(0.1) rotate(0deg); opacity: 0; }
            15% { opacity: 0.6; }
            85% { opacity: 0.6; }
            100% { transform: scale(4) rotate(15deg); opacity: 0; }
        }

        .screen {
            display: none;
            position: absolute;
            inset: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
            opacity: 0;
            transition: opacity 0.8s ease;
            z-index: 10;
        }

        .screen.active { display: flex; opacity: 1; }

        .object-btn {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            padding: 0.75rem 0.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-radius: 4px;
        }

        .object-btn.selected {
            background: var(--autumn-orange);
            color: white;
            border-color: var(--autumn-orange);
            transform: scale(0.95);
        }

        .voice-btn {
            font-family: 'Permanent Marker', cursive;
            font-size: 2rem;
            transition: color 0.3s, transform 0.3s;
        }

        @media (min-width: 640px) {
            .voice-btn { font-size: 3rem; }
            .object-btn { font-size: 0.75rem; padding: 1.25rem; }
        }

        .typewriter { font-family: 'Special Elite', serif; }

        .btn-main {
            border: 1px solid var(--text-off);
            padding: 0.75rem 2rem;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 0.2em;
            font-size: 0.75rem;
            transition: all 0.3s;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(4px);
        }

        .btn-main:hover {
            background: var(--text-off);
            color: var(--bg-deep);
        }

        #secret-trigger {
            position: fixed; top: 0; right: 0; width: 50px; height: 50px;
            z-index: 9999; cursor: pointer; background: transparent;
        }

        #admin-panel {
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 450px; height: 100%;
            background: #0a0a0a; color: #eee; z-index: 10000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 1.5rem; overflow-y: auto; border-left: 1px solid #222;
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
        }
        #admin-panel.open { right: 0; }
        
        .admin-input {
            background: #151515; border: 1px solid #333; color: white;
            width: 100%; padding: 0.7rem; margin-bottom: 1rem; font-size: 0.8rem;
            border-radius: 6px; outline: none; transition: border-color 0.2s;
        }
        .admin-input:focus { border-color: var(--autumn-orange); }

        .song-editor-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            border-radius: 12px;
        }
        
        label { font-size: 0.6rem; text-transform: uppercase; opacity: 0.6; font-weight: 900; letter-spacing: 0.15em; margin-bottom: 0.5rem; display: block; color: var(--autumn-orange); }

        /* Custom Scrollbar */
        #admin-panel::-webkit-scrollbar { width: 6px; }
        #admin-panel::-webkit-scrollbar-track { background: transparent; }
        #admin-panel::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="grain"></div>
    
    <video id="bg-video" autoplay muted loop playsinline></video>
    <div class="bg-layer" id="dynamic-bg"></div>
    <div id="trees-container"></div>

    <div id="secret-trigger" onclick="openLogin()"></div>

    <!-- PANTALLA 1: LANDING -->
    <div id="screen-landing" class="screen active">
        <h1 id="editable-title" class="text-5xl sm:text-8xl font-black tracking-tighter mb-2">INNERSPEAKER</h1>
        <h2 id="editable-subtitle" class="text-lg sm:text-2xl font-light tracking-[0.4em] mb-12 sm:mb-16 opacity-80 uppercase">TAME IMPALA</h2>
        <button onclick="goTo('room')" id="btn-start" class="btn-main opacity-40 pointer-events-none">Sincronizando...</button>
        <p id="status-text" class="text-[8px] sm:text-[9px] mt-6 uppercase opacity-40 tracking-widest">Conectando con la red psicodélica...</p>
    </div>

    <!-- PANTALLA 2: ROOM -->
    <div id="screen-room" class="screen">
        <h2 class="text-[9px] font-black uppercase tracking-[0.4em] mb-6 sm:mb-8 opacity-40">Percepción del entorno</h2>
        <div class="grid grid-cols-3 gap-2 sm:gap-3 w-full max-w-sm" id="objects-grid"></div>
        <p id="room-instruction" class="mt-8 text-[9px] opacity-40 uppercase tracking-widest">Selecciona 3 fragmentos de tu realidad</p>
    </div>

    <!-- PANTALLA 3: VOICE -->
    <div id="screen-voice" class="screen">
        <h2 class="text-[9px] font-black uppercase tracking-[0.4em] mb-12 opacity-40">La Voz Interior</h2>
        <div class="flex flex-col gap-6 sm:gap-8">
            <button onclick="setVoice('kind')" class="voice-btn">Amable</button>
            <div class="h-[1px] bg-white/10 w-24 sm:w-32 mx-auto"></div>
            <button onclick="setVoice('critical')" class="voice-btn">Crítica</button>
        </div>
    </div>

    <!-- PANTALLA 4: LOADING -->
    <div id="screen-loading" class="screen">
        <div class="w-10 h-10 border border-white/10 border-t-white rounded-full animate-spin mb-6"></div>
        <p id="loading-msg" class="typewriter text-[9px] uppercase tracking-[0.3em] animate-pulse">Buscando resonancia armónica...</p>
    </div>

    <!-- PANTALLA 5: RESULT -->
    <div id="screen-result" class="screen">
        <div class="max-w-md px-4">
            <h3 id="res-title" class="text-3xl sm:text-5xl font-black uppercase tracking-tighter mb-3"></h3>
            <p id="res-tag" class="text-[9px] font-bold text-orange-400 uppercase tracking-widest mb-5 opacity-60"></p>
            <div class="h-[1px] bg-white/10 w-full mb-6 sm:mb-8"></div>
            <p id="res-desc" class="typewriter text-xs sm:text-sm leading-relaxed mb-6"></p>
            <p id="res-critique" class="typewriter text-[10px] sm:text-[11px] italic opacity-40 mb-10 sm:mb-12"></p>
            
            <div class="flex flex-col gap-4 items-center justify-center">
                <a id="res-link" href="#" target="_blank" class="btn-main w-full sm:w-auto">Escuchar Track</a>
                <button onclick="location.reload()" class="text-[8px] uppercase font-black opacity-30 hover:opacity-100 tracking-widest transition-opacity mt-4">Reiniciar Conciencia</button>
            </div>
        </div>
    </div>

    <!-- PANEL DE ADMIN AVANZADO -->
    <div id="admin-panel">
        <div class="flex justify-between items-center mb-8">
            <h2 class="font-black text-orange-500 tracking-tighter text-2xl">CONTROL CORE</h2>
            <button onclick="closeAdmin()" class="text-xs opacity-50 uppercase font-bold tracking-widest">Cerrar</button>
        </div>
        
        <div class="mb-12">
            <h3 class="text-[10px] font-black mb-6 uppercase text-orange-300 border-b border-orange-300/10 pb-2">Estética del Sistema</h3>
            <label>Título del Álbum</label>
            <input type="text" id="admin-title" class="admin-input">
            
            <label>Artista / Subtítulo</label>
            <input type="text" id="admin-subtitle" class="admin-input">

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label>Color Aura (Gradiente)</label>
                    <input type="color" id="admin-c1" class="admin-input h-12 cursor-pointer">
                </div>
                <div>
                    <label>Color Mente (Fondo)</label>
                    <input type="color" id="admin-c2" class="admin-input h-12 cursor-pointer">
                </div>
            </div>

            <label>Fondo de Video (URL .mp4)</label>
            <input type="text" id="admin-video" class="admin-input" placeholder="https://...">
            
            <label>Fondo de Imagen (URL .jpg/.png)</label>
            <input type="text" id="admin-bg-img" class="admin-input" placeholder="https://...">
            
            <label>Opacidad del Bosque (0 a 1)</label>
            <input type="number" id="admin-tree-op" step="0.1" min="0" max="1" class="admin-input">
        </div>

        <div class="mb-12">
            <h3 class="text-[10px] font-black mb-6 uppercase text-orange-300 border-b border-orange-300/10 pb-2">Gestión de Canciones (YouTube)</h3>
            <div id="songs-editor-container">
                <!-- Inyectado vía JS -->
            </div>
        </div>

        <div class="sticky bottom-0 bg-[#0a0a0a] pt-4 pb-6">
            <button onclick="updateAndSaveConfig()" class="w-full bg-orange-600 py-4 text-xs font-black uppercase rounded shadow-xl hover:bg-orange-500 transition-all transform active:scale-95">Sincronizar Cambios</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-innerspeaker';
        const configDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'config', 'main');

        const OBJECT_MAP = {
            'Audífonos': { songs: ['Alter Ego', 'Solitude Is Bliss'] },
            'Espejo': { songs: ['Alter Ego', 'Expectation'] },
            'Ventana': { songs: ['Runway, Houses, City, Clouds', 'Lucidity'] },
            'Libreta': { songs: ['Why Won’t You Make Up Your Mind?', 'Expectation'] },
            'Silla': { songs: ['Jeremy\'s Storm', 'I Don\'t Really Mind'] },
            'Reloj': { songs: ['The Bold Arrow Of Time', 'Why Won’t You Make Up Your Mind?'] },
            'Lámpara': { songs: ['Lucidity', 'Desire Be Desire Go'] },
            'Vinilo': { songs: ['It Is Not Meant To Be', 'The Bold Arrow Of Time'] },
            'Cama': { songs: ['It Is Not Meant To Be', 'Desire Be Desire Go'] }
        };

        const TONAL_FAMILIES = {
            kind: ['Solitude Is Bliss', 'Lucidity', 'Runway, Houses, City, Clouds', 'I Don\'t Really Mind', 'Desire Be Desire Go'],
            critical: ['Alter Ego', 'Expectation', 'Why Won’t You Make Up Your Mind?', 'It Is Not Meant To Be', 'Jeremy\'s Storm', 'The Bold Arrow Of Time']
        };

        let user = null;
        let selected = [];
        let innerVoice = null;
        let currentConfig = {
            title: "INNERSPEAKER",
            subtitle: "TAME IMPALA",
            color1: "#c87c4a",
            color2: "#4b6a4a",
            bgVideo: "",
            bgImage: "",
            treeOpacity: 0.4,
            songs: [
                { title: "It Is Not Meant To Be", tag: "Distancia", desc: "La sensación de que algo está fuera de tu alcance por naturaleza.", critique: "Aceptación de lo imposible.", url: "https://youtu.be/3a7jLiSCtfU" },
                { title: "Desire Be Desire Go", tag: "Movimiento", desc: "El deseo es una fuerza que fluye y se desvanece constantemente.", critique: "Fuga cerebral.", url: "https://youtu.be/L_u7IPrN2-8" },
                { title: "Alter Ego", tag: "Dualidad", desc: "La única persona que realmente puede cambiarte eres tú mismo.", critique: "Conversación interna.", url: "https://youtu.be/VpLXxFhy7s4" },
                { title: "Lucidity", tag: "Claridad", desc: "Momentos breves donde todo parece tener un sentido geométrico.", critique: "El despertar.", url: "https://youtu.be/fM_LIsA3vH8" },
                { title: "Why Won’t You Make Up Your Mind?", tag: "Indecisión", desc: "La parálisis que viene de analizar demasiado cada paso.", critique: "Bucle infinito.", url: "https://youtu.be/CwIV58Fk6GQ" },
                { title: "Solitude Is Bliss", tag: "Libertad", desc: "No hay nada más expansivo que la soledad por elección.", critique: "Independencia pura.", url: "https://youtu.be/N7eGu_p2jLk" },
                { title: "Jeremy's Storm", tag: "Caos", desc: "Una tormenta instrumental que limpia el ruido de la mente.", critique: "Limpieza sónica.", url: "https://youtu.be/kU_pLgPscvA" },
                { title: "Expectation", tag: "Ilusión", desc: "La brecha dolorosa entre lo que imaginamos y lo que ocurre.", critique: "Realismo psicodélico.", url: "https://youtu.be/i6Hm8SJF668" },
                { title: "The Bold Arrow Of Time", tag: "Blues", desc: "El tiempo avanza como una flecha pesada y distorsionada.", critique: "Anacronismo.", url: "https://youtu.be/S4pI6v_YQwI" },
                { title: "Runway, Houses, City, Clouds", tag: "Perspectiva", desc: "Mirar el mundo desde lo más alto para entender su pequeñez.", critique: "Viaje astral.", url: "https://youtu.be/t_uI-H09_f0" },
                { title: "I Don't Really Mind", tag: "Final", desc: "Al final del día, nada importa tanto como la calma.", critique: "Cierre de ciclo.", url: "https://youtu.be/q09R69Yf0Hk" }
            ]
        };

        // Render inicial de botones
        const grid = document.getElementById('objects-grid');
        Object.keys(OBJECT_MAP).forEach(obj => {
            const btn = document.createElement('button');
            btn.className = 'object-btn';
            btn.innerText = obj;
            btn.onclick = () => toggleObject(btn, obj);
            grid.appendChild(btn);
        });

        // Listeners Firestore
        onSnapshot(configDocRef, (snap) => {
            if (snap.exists()) {
                currentConfig = { ...currentConfig, ...snap.data() };
                applyConfig();
                updateAdminForm();
            }
        });

        function applyConfig() {
            document.getElementById('editable-title').innerText = currentConfig.title;
            document.getElementById('editable-subtitle').innerText = currentConfig.subtitle;
            const bgLayer = document.getElementById('dynamic-bg');
            const videoEl = document.getElementById('bg-video');

            if (currentConfig.bgVideo) {
                videoEl.src = currentConfig.bgVideo;
                videoEl.style.opacity = "1";
                bgLayer.style.opacity = "0.3";
            } else {
                videoEl.style.opacity = "0";
                bgLayer.style.opacity = "1";
            }

            if (currentConfig.bgImage) {
                bgLayer.style.backgroundImage = `url(${currentConfig.bgImage})`;
            } else {
                bgLayer.style.backgroundImage = "none";
                bgLayer.style.background = `radial-gradient(circle at 50% 100%, ${currentConfig.color1} -20%, ${currentConfig.color2} 40%, var(--bg-deep) 90%)`;
            }

            document.querySelectorAll('.tree').forEach(t => t.style.opacity = currentConfig.treeOpacity);
        }

        function updateAdminForm() {
            document.getElementById('admin-title').value = currentConfig.title;
            document.getElementById('admin-subtitle').value = currentConfig.subtitle;
            document.getElementById('admin-c1').value = currentConfig.color1;
            document.getElementById('admin-c2').value = currentConfig.color2;
            document.getElementById('admin-video').value = currentConfig.bgVideo || "";
            document.getElementById('admin-bg-img').value = currentConfig.bgImage || "";
            document.getElementById('admin-tree-op').value = currentConfig.treeOpacity;

            const songContainer = document.getElementById('songs-editor-container');
            songContainer.innerHTML = '';
            
            currentConfig.songs.forEach((song, idx) => {
                const card = document.createElement('div');
                card.className = 'song-editor-card';
                card.innerHTML = `
                    <label>#${idx + 1} TRACK TITLE</label>
                    <input type="text" data-idx="${idx}" data-field="title" value="${song.title}" class="admin-input song-field">
                    <label>YOUTUBE URL</label>
                    <input type="text" data-idx="${idx}" data-field="url" value="${song.url}" class="admin-input song-field" placeholder="https://...">
                    <label>DESCRIPCIÓN</label>
                    <textarea data-idx="${idx}" data-field="desc" class="admin-input song-field h-16">${song.desc}</textarea>
                    <label>CRÍTICA POÉTICA</label>
                    <input type="text" data-idx="${idx}" data-field="critique" value="${song.critique}" class="admin-input song-field">
                `;
                songContainer.appendChild(card);
            });
        }

        window.updateAndSaveConfig = async () => {
            if (!user) return;
            
            const songInputs = document.querySelectorAll('.song-field');
            const updatedSongs = [...currentConfig.songs];
            
            songInputs.forEach(input => {
                const idx = input.getAttribute('data-idx');
                const field = input.getAttribute('data-field');
                updatedSongs[idx][field] = input.value;
            });

            const newConfig = {
                title: document.getElementById('admin-title').value,
                subtitle: document.getElementById('admin-subtitle').value,
                color1: document.getElementById('admin-c1').value,
                color2: document.getElementById('admin-c2').value,
                bgVideo: document.getElementById('admin-video').value,
                bgImage: document.getElementById('admin-bg-img').value,
                treeOpacity: parseFloat(document.getElementById('admin-tree-op').value),
                songs: updatedSongs
            };

            try {
                await setDoc(configDocRef, newConfig);
                alert("Base de Datos Sincronizada.");
                closeAdmin();
            } catch (e) {
                console.error(e);
                alert("Error al guardar.");
            }
        };

        window.toggleObject = (btn, name) => {
            if (selected.includes(name)) {
                selected = selected.filter(n => n !== name);
                btn.classList.remove('selected');
            } else if (selected.length < 3) {
                selected.push(name);
                btn.classList.add('selected');
            }
            if (selected.length === 3) setTimeout(() => goTo('voice'), 400);
        };

        window.setVoice = (v) => {
            innerVoice = v;
            goTo('loading');
            setTimeout(() => showResult(), 2000);
        };

        function showResult() {
            const firstObj = selected[0];
            const baseSongs = OBJECT_MAP[firstObj].songs;
            let candidateTitle = baseSongs[Math.floor(Math.random() * baseSongs.length)];

            if (!TONAL_FAMILIES[innerVoice].includes(candidateTitle)) {
                candidateTitle = TONAL_FAMILIES[innerVoice][Math.floor(Math.random() * TONAL_FAMILIES[innerVoice].length)];
            }

            const result = currentConfig.songs.find(s => s.title === candidateTitle) || currentConfig.songs[0];
            document.getElementById('res-title').innerText = result.title;
            document.getElementById('res-tag').innerText = "Vibración Resonante";
            document.getElementById('res-desc').innerText = result.desc;
            document.getElementById('res-critique').innerText = result.critique;
            document.getElementById('res-link').href = result.url;
            goTo('result');
        }

        window.goTo = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${id}`).classList.add('active');
        };

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (u) {
                const btn = document.getElementById('btn-start');
                document.getElementById('status-text').innerText = "Frecuencia Estable.";
                btn.innerText = "ACCEDER";
                btn.classList.remove('opacity-40', 'pointer-events-none');
            }
        });

        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else { await signInAnonymously(auth); }
        };
        initAuth();

        function createTree() {
            const container = document.getElementById('trees-container');
            const tree = document.createElement('div');
            tree.className = 'tree';
            tree.innerHTML = `<svg viewBox="0 0 100 100"><path d="M50 10 L85 85 L15 85 Z" fill="currentColor"/><rect x="45" y="85" width="10" height="15" fill="currentColor"/></svg>`;
            tree.style.left = `${Math.random() * 100}%`;
            tree.style.top = `${Math.random() * 80}%`;
            tree.style.animation = `zoomTree ${20 + Math.random() * 20}s linear ${Math.random() * 10}s infinite`;
            container.appendChild(tree);
        }
        for(let i=0; i<12; i++) createTree();

        window.openLogin = () => {
            const u = prompt("User:");
            const p = prompt("Key:");
            if(u === 'asaehvi' && p === 'notasdazul') document.getElementById('admin-panel').classList.add('open');
        };
        window.closeAdmin = () => document.getElementById('admin-panel').classList.remove('open');
    </script>
</body>
</html>
