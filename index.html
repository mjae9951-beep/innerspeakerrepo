<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Innerspeaker - Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Permanent+Marker&family=Inter:wght@200;300;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0d1b1a; 
            --leaf-green: #4b6a4a;
            --autumn-orange: #c87c4a;
            --text-off: #e8e4d9;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-deep);
            color: var(--text-off);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .grain {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.15; pointer-events: none; z-index: 50;
        }

        .bg-layer {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 100%, var(--autumn-orange) -20%, var(--leaf-green) 40%, var(--bg-deep) 90%);
            z-index: -2;
            transition: background 1s ease;
        }

        .tree {
            position: absolute;
            width: 150px; height: 150px;
            color: rgba(20, 40, 30, 0.6);
            transform-origin: center;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes zoomTree {
            0% { transform: scale(0.1) rotate(0deg); opacity: 0; }
            15% { opacity: 0.8; }
            85% { opacity: 0.8; }
            100% { transform: scale(4) rotate(15deg); opacity: 0; }
        }

        .screen {
            display: none;
            position: absolute;
            inset: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .screen.active { display: flex; opacity: 1; }

        .object-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem;
            transition: all 0.3s;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .object-btn.selected {
            background: var(--autumn-orange);
            color: white;
            border-color: var(--autumn-orange);
            transform: scale(0.95);
        }

        .voice-btn {
            font-family: 'Permanent Marker', cursive;
            font-size: 2.5rem;
            transition: color 0.3s;
        }

        .voice-btn:hover { color: var(--autumn-orange); }

        .typewriter { font-family: 'Special Elite', serif; }

        .btn-main {
            border: 1px solid var(--text-off);
            padding: 0.75rem 2.5rem;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 0.2em;
            font-size: 0.8rem;
            transition: all 0.3s;
        }

        .btn-main:hover {
            background: var(--text-off);
            color: var(--bg-deep);
        }

        #secret-trigger {
            position: fixed; 
            top: 0; 
            right: 0; 
            width: 60px; 
            height: 60px;
            z-index: 9999;
            cursor: pointer; 
            background: rgba(255, 255, 255, 0.01);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #admin-panel {
            position: fixed; top: 0; right: -450px; width: 400px; height: 100%;
            background: #0f0f0f; color: #eee; z-index: 10000; transition: 0.4s;
            padding: 2rem; overflow-y: auto; border-left: 1px solid #333;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }
        #admin-panel.open { right: 0; }
        .admin-input {
            background: #1a1a1a; border: 1px solid #333; color: white;
            width: 100%; padding: 0.6rem; margin-bottom: 1rem; font-size: 0.8rem;
            border-radius: 4px;
        }
        .admin-label { display: block; font-size: 10px; text-transform: uppercase; margin-bottom: 4px; color: #888; font-weight: bold; }
    </style>
</head>
<body>

    <div class="grain"></div>
    <div class="bg-layer" id="dynamic-bg"></div>
    <div id="trees-container"></div>

    <div id="secret-trigger" onclick="openLogin()">
        <span style="font-size: 8px; opacity: 0.1;">.</span>
    </div>

    <!-- PANTALLA 1: LANDING -->
    <div id="screen-landing" class="screen active">
        <h1 id="editable-title" class="text-6xl sm:text-8xl font-black tracking-tighter mb-2">INNERSPEAKER</h1>
        <h2 id="editable-subtitle" class="text-xl sm:text-2xl font-light tracking-[0.5em] mb-16 opacity-80">TAME IMPALA</h2>
        <button onclick="goTo('room')" id="btn-start" class="btn-main opacity-40 pointer-events-none">Iniciando...</button>
        <p id="status-text" class="text-[9px] mt-6 uppercase opacity-40">Sintonizando frecuencias...</p>
    </div>

    <!-- PANTALLA 2: ROOM -->
    <div id="screen-room" class="screen">
        <h2 class="text-[10px] font-black uppercase tracking-[0.3em] mb-8 opacity-40">Paso 01 / Percepción del entorno</h2>
        <div class="grid grid-cols-3 gap-3 w-full max-w-sm">
            <button class="object-btn" onclick="toggleObject(this, 'Espejo')">Espejo</button>
            <button class="object-btn" onclick="toggleObject(this, 'Ventana')">Ventana</button>
            <button class="object-btn" onclick="toggleObject(this, 'Libreta')">Libreta</button>
            <button class="object-btn" onclick="toggleObject(this, 'Silla')">Silla</button>
            <button class="object-btn" onclick="toggleObject(this, 'Reloj')">Reloj</button>
            <button class="object-btn" onclick="toggleObject(this, 'Lámpara')">Lámpara</button>
            <button class="object-btn" onclick="toggleObject(this, 'Cámara')">Cámara</button>
            <button class="object-btn" onclick="toggleObject(this, 'Vinilo')">Vinilo</button>
            <button class="object-btn" onclick="toggleObject(this, 'Planta')">Planta</button>
        </div>
        <p id="room-instruction" class="mt-8 text-[10px] opacity-40 uppercase">Selecciona 3 fragmentos de tu realidad</p>
    </div>

    <!-- PANTALLA 3: VOICE -->
    <div id="screen-voice" class="screen">
        <h2 class="text-[10px] font-black uppercase tracking-[0.3em] mb-12 opacity-40">Paso 02 / La Voz Interior</h2>
        <div class="flex flex-col gap-8">
            <button onclick="setVoice('kind')" class="voice-btn">Amable</button>
            <div class="h-[1px] bg-white/10 w-32 mx-auto"></div>
            <button onclick="setVoice('critical')" class="voice-btn">Crítica</button>
        </div>
    </div>

    <!-- PANTALLA 4: LOADING -->
    <div id="screen-loading" class="screen">
        <div class="w-16 h-16 border-2 border-white/20 border-t-white rounded-full animate-spin mb-6"></div>
        <p id="loading-msg" class="typewriter text-xs uppercase tracking-widest animate-pulse">Analizando resonancia...</p>
    </div>

    <!-- PANTALLA 5: RESULT -->
    <div id="screen-result" class="screen">
        <div class="max-w-md">
            <h3 id="res-title" class="text-4xl sm:text-5xl font-black uppercase tracking-tighter mb-4"></h3>
            <p id="res-tag" class="text-[10px] font-bold text-orange-400 uppercase tracking-widest mb-6"></p>
            <div class="h-[1px] bg-white/20 w-full mb-6"></div>
            <p id="res-desc" class="typewriter text-sm leading-relaxed mb-6"></p>
            <p id="res-critique" class="typewriter text-xs italic opacity-40 mb-12"></p>
            
            <div class="flex flex-col sm:flex-row gap-4 items-center justify-center">
                <a id="res-link" href="#" target="_blank" class="btn-main">Escuchar</a>
                <button onclick="location.reload()" class="text-[9px] uppercase font-black opacity-30 hover:opacity-100 transition-opacity">Reiniciar</button>
            </div>
        </div>
    </div>

    <!-- PANEL DE ADMIN -->
    <div id="admin-panel">
        <div class="flex justify-between items-center mb-6">
            <h2 class="font-black text-orange-500">CONTROL MAESTRO</h2>
            <button onclick="closeAdmin()" class="text-xs opacity-50 hover:opacity-100">CERRAR</button>
        </div>
        
        <label class="admin-label">Título Principal</label>
        <input type="text" id="admin-main-title" class="admin-input" oninput="syncLiveText('editable-title', this.value)">
        
        <label class="admin-label">Subtítulo</label>
        <input type="text" id="admin-sub-title" class="admin-input" oninput="syncLiveText('editable-subtitle', this.value)">

        <label class="admin-label">Gradiente: Naranja / Verde</label>
        <div class="flex gap-2 mb-4">
            <input type="color" id="admin-color-1" class="h-10 w-full bg-transparent border-0" oninput="updateLiveColors()">
            <input type="color" id="admin-color-2" class="h-10 w-full bg-transparent border-0" oninput="updateLiveColors()">
        </div>

        <div class="h-[1px] bg-white/10 my-6"></div>
        
        <h3 class="text-[10px] font-black mb-4 uppercase tracking-widest text-orange-300">Base de Datos: 11 Canciones</h3>
        
        <div id="song-manager-container"></div>
        
        <button onclick="saveGlobalConfig()" class="w-full bg-orange-600 py-3 mt-4 text-xs font-black uppercase rounded shadow-lg hover:bg-orange-500 transition-colors">Sincronizar con la Nube</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { 
            getFirestore, doc, setDoc, onSnapshot, 
            initializeFirestore, persistentLocalCache, persistentMultipleTabManager 
        } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const fbConfigRaw = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
        const firebaseConfig = fbConfigRaw ? JSON.parse(fbConfigRaw) : {
            apiKey: "AIzaSyCXcM54HHeambvpHkJY1-N1G3Q7UPcPOj8",
            authDomain: "innerspeaker-568f3.firebaseapp.com",
            projectId: "innerspeaker-568f3",
            storageBucket: "innerspeaker-568f3.firebasestorage.app",
            messagingSenderId: "945238998266",
            appId: "1:945238998266:web:661d0080b0d42cb7a59d43"
        };

        const app = initializeApp(firebaseConfig);
        const db = initializeFirestore(app, {
            localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
        });
        const auth = getAuth(app);

        const rawAppId = typeof __app_id !== 'undefined' ? __app_id : 'default-innerspeaker';
        const configDocRef = rawAppId.includes('/') 
            ? doc(db, rawAppId, 'public', 'data', 'config', 'main') 
            : doc(db, 'artifacts', rawAppId, 'public', 'data', 'config', 'main');

        let user = null;
        let selected = [];
        let innerVoice = null;
        
        // BASE DE DATOS COMPLETA DE 11 CANCIONES
        let currentConfig = {
            title: "INNERSPEAKER",
            subtitle: "TAME IMPALA",
            color1: "#c87c4a",
            color2: "#4b6a4a",
            songs: [
                { title: "It Is Not Meant To Be", tag: "Distancia", desc: "La sensación de que algo está fuera de tu alcance por naturaleza.", critique: "Aceptación de lo imposible.", url: "https://youtu.be/3a7jLiSCtfU" },
                { title: "Desire Be Desire Go", tag: "Movimiento", desc: "El deseo es una fuerza que fluye y se desvanece constantemente.", critique: "Fuga cerebral.", url: "https://youtu.be/L_u7IPrN2-8" },
                { title: "Alter Ego", tag: "Dualidad", desc: "La única persona que realmente puede cambiarte eres tú mismo.", critique: "Conversación interna.", url: "https://youtu.be/VpLXxFhy7s4" },
                { title: "Lucidity", tag: "Claridad", desc: "Momentos breves donde todo parece tener un sentido geométrico.", critique: "El despertar.", url: "https://youtu.be/fM_LIsA3vH8" },
                { title: "Why Won’t You Make Up Your Mind?", tag: "Indecisión", desc: "La parálisis que viene de analizar demasiado cada paso.", critique: "Bucle infinito.", url: "https://youtu.be/CwIV58Fk6GQ" },
                { title: "Solitude Is Bliss", tag: "Libertad", desc: "No hay nada más expansivo que la soledad por elección.", critique: "Independencia pura.", url: "https://youtu.be/N7eGu_p2jLk" },
                { title: "Jeremy's Storm", tag: "Caos", desc: "Una tormenta instrumental que limpia el ruido de la mente.", critique: "Limpieza sónica.", url: "https://youtu.be/kU_pLgPscvA" },
                { title: "Expectation", tag: "Ilusión", desc: "La brecha dolorosa entre lo que imaginamos y lo que ocurre.", critique: "Realismo psicodélico.", url: "https://youtu.be/i6Hm8SJF668" },
                { title: "The Bold Arrow Of Time", tag: "Blues", desc: "El tiempo avanza como una flecha pesada y distorsionada.", critique: "Anacronismo.", url: "https://youtu.be/S4pI6v_YQwI" },
                { title: "Runway, Houses, City, Clouds", tag: "Perspectiva", desc: "Mirar el mundo desde lo más alto para entender su pequeñez.", critique: "Viaje astral.", url: "https://youtu.be/t_uI-H09_f0" },
                { title: "I Don't Really Mind", tag: "Final", desc: "Al final del día, nada importa tanto como la calma.", critique: "Cierre de ciclo.", url: "https://youtu.be/q09R69Yf0Hk" }
            ]
        };

        onSnapshot(configDocRef, (snap) => {
            if (snap.exists()) {
                const data = snap.data();
                // Asegurar que si la nube no tiene canciones o tiene pocas, mantengamos las 11
                if (!data.songs || data.songs.length < 11) {
                    saveGlobalConfig(true); 
                } else {
                    currentConfig = data;
                }
                applyConfig();
            } else {
                saveGlobalConfig(true); 
            }
        });

        function applyConfig() {
            document.getElementById('editable-title').innerText = currentConfig.title;
            document.getElementById('editable-subtitle').innerText = currentConfig.subtitle;
            document.getElementById('dynamic-bg').style.background = `radial-gradient(circle at 50% 100%, ${currentConfig.color1} -20%, ${currentConfig.color2} 40%, var(--bg-deep) 90%)`;
            
            if(document.getElementById('admin-main-title')) {
                document.getElementById('admin-main-title').value = currentConfig.title;
                document.getElementById('admin-sub-title').value = currentConfig.subtitle;
                document.getElementById('admin-color-1').value = currentConfig.color1;
                document.getElementById('admin-color-2').value = currentConfig.color2;
            }
            renderSongList();
        }

        window.syncLiveText = (id, val) => { 
            document.getElementById(id).innerText = val; 
            if (id === 'editable-title') currentConfig.title = val;
            if (id === 'editable-subtitle') currentConfig.subtitle = val;
        };

        window.updateLiveColors = () => {
            const c1 = document.getElementById('admin-color-1').value;
            const c2 = document.getElementById('admin-color-2').value;
            document.getElementById('dynamic-bg').style.background = `radial-gradient(circle at 50% 100%, ${c1} -20%, ${c2} 40%, var(--bg-deep) 90%)`;
            currentConfig.color1 = c1; 
            currentConfig.color2 = c2;
        };

        window.saveGlobalConfig = async (silent = false) => {
            if (!user) return;
            try {
                await setDoc(configDocRef, currentConfig);
                if (!silent) alert("Sincronización completa: 11 canciones en la nube.");
            } catch (e) { console.error(e); }
        };

        function renderSongList() {
            const container = document.getElementById('song-manager-container');
            if (!container) return;
            container.innerHTML = '';
            currentConfig.songs.forEach((song, idx) => {
                const div = document.createElement('div');
                div.className = "mb-6 p-4 bg-white/5 rounded-lg border border-white/10";
                div.innerHTML = `
                    <div class="flex justify-between mb-2">
                        <span class="text-[9px] font-black text-orange-400">PISTA ${String(idx + 1).padStart(2, '0')}</span>
                    </div>
                    <label class="admin-label">Título</label>
                    <input class="admin-input mb-2" value="${song.title}" oninput="currentConfig.songs[${idx}].title = this.value">
                    <label class="admin-label">URL YouTube</label>
                    <input class="admin-input mb-2" value="${song.url}" oninput="currentConfig.songs[${idx}].url = this.value">
                    <label class="admin-label">Descripción Metafísica</label>
                    <textarea class="admin-input h-20" oninput="currentConfig.songs[${idx}].desc = this.value">${song.desc}</textarea>
                `;
                container.appendChild(div);
            });
        }

        window.openLogin = () => {
            const u = prompt("Admin User:");
            const p = prompt("Admin Key:");
            if(u === 'asaehvi' && p === 'notasdazul') {
                document.getElementById('admin-panel').classList.add('open');
            }
        };

        window.closeAdmin = () => document.getElementById('admin-panel').classList.remove('open');

        // LÓGICA DE LA EXPERIENCIA
        onAuthStateChanged(auth, (u) => {
            user = u;
            if (u) {
                const btn = document.getElementById('btn-start');
                document.getElementById('status-text').innerText = "Realidad sintonizada.";
                btn.innerText = "ENTRAR";
                btn.classList.remove('opacity-40', 'pointer-events-none');
            }
        });

        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else { await signInAnonymously(auth); }
        };
        initAuth();

        window.goTo = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${id}`).classList.add('active');
        };

        window.toggleObject = (btn, name) => {
            if (selected.includes(name)) {
                selected = selected.filter(n => n !== name);
                btn.classList.remove('selected');
            } else if (selected.length < 3) {
                selected.push(name);
                btn.classList.add('selected');
            }
            document.getElementById('room-instruction').innerText = `Seleccionados: ${selected.length} / 3`;
            if (selected.length === 3) { setTimeout(() => goTo('voice'), 400); }
        };

        window.setVoice = (v) => {
            innerVoice = v;
            goTo('loading');
            setTimeout(() => showResult(), 2000); 
        };

        function showResult() {
            // Algoritmo de selección basado en los objetos elegidos
            const weight = selected.reduce((acc, s) => acc + s.length, 0);
            const index = weight % currentConfig.songs.length;
            const result = currentConfig.songs[index];

            document.getElementById('res-title').innerText = result.title;
            document.getElementById('res-tag').innerText = innerVoice === 'kind' ? 'VOZ AMABLE' : 'VOZ CRÍTICA';
            document.getElementById('res-desc').innerText = result.desc;
            document.getElementById('res-critique').innerText = result.critique;
            document.getElementById('res-link').href = result.url;
            
            goTo('result');
        }

        // GENERADOR DE ÁRBOLES
        function createTree() {
            const container = document.getElementById('trees-container');
            if(!container) return;
            const tree = document.createElement('div');
            tree.className = 'tree';
            tree.innerHTML = `<svg viewBox="0 0 100 100"><path d="M50 10 L85 85 L15 85 Z" fill="currentColor"/><rect x="45" y="85" width="10" height="15" fill="currentColor"/></svg>`;
            tree.style.left = `${Math.random() * 100}%`;
            tree.style.top = `${Math.random() * 80}%`;
            tree.style.animation = `zoomTree ${15 + Math.random() * 15}s linear ${Math.random() * 10}s infinite`;
            container.appendChild(tree);
        }
        for(let i=0; i<20; i++) createTree();
    </script>
</body>
</html>
