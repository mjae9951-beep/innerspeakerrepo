<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Innerspeaker - Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Permanent+Marker&family=Inter:wght@200;300;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0d1b1a; 
            --leaf-green: #4b6a4a;
            --autumn-orange: #c87c4a;
            --text-off: #e8e4d9;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background-color: var(--bg-deep);
            color: var(--text-off);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }

        /* FONDO TOTAL */
        #media-container {
            position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -3;
            overflow: hidden; background: var(--bg-deep);
        }
        #bg-video, #bg-image {
            position: absolute; top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover; opacity: 0; transition: opacity 2s ease;
        }

        /* Capa de tinte para legibilidad */
        .bg-overlay {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, rgba(13, 27, 26, 0.4) 0%, rgba(13, 27, 26, 0.8) 100%);
            z-index: -2;
        }

        .grain {
            position: fixed; inset: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.15; pointer-events: none; z-index: 50;
        }

        .screen {
            position: fixed; inset: 0;
            display: none; flex-direction: column; align-items: center;
            justify-content: center; padding: 2rem;
            text-align: center; opacity: 0;
            transition: opacity 0.8s ease; z-index: 10;
        }
        .screen.active { display: flex; opacity: 1; }

        .object-btn {
            background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 12px;
            font-size: 0.75rem; text-transform: uppercase; font-weight: 600;
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
        }
        .object-btn.selected { 
            background: var(--autumn-orange); 
            border-color: white; 
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .btn-main {
            border: 1px solid var(--text-off); padding: 1.2rem 2rem;
            text-transform: uppercase; font-weight: 900; letter-spacing: 0.4em;
            font-size: 0.7rem; background: rgba(0,0,0,0.7);
            width: 100%; max-width: 260px; transition: all 0.3s;
            cursor: pointer;
        }
        .btn-main:active { transform: scale(0.95); background: var(--text-off); color: black; }

        .voice-btn { font-family: 'Permanent Marker', cursive; font-size: 2.2rem; transition: 0.3s; }
        .voice-btn:hover { color: var(--autumn-orange); transform: scale(1.1); }

        #secret-trigger { 
            position: fixed; bottom: 0; right: 0; width: 60px; height: 60px; 
            z-index: 1000; cursor: pointer; opacity: 0;
        }

        #admin-panel {
            position: fixed; top: 0; right: -100%; width: 100%; height: 100%;
            background: #0a0a0a; color: white; z-index: 2000; transition: 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            display: flex; flex-direction: column; font-family: system-ui, sans-serif;
        }
        #admin-panel.open { right: 0; }
        .admin-content { flex: 1; overflow-y: auto; padding: 2rem; }
        .admin-input {
            width: 100%; background: #1a1a1a; border: 1px solid #333;
            padding: 12px; border-radius: 6px; color: white; margin-bottom: 15px; font-size: 14px;
        }

        .typewriter { font-family: 'Special Elite', serif; }
    </style>
</head>
<body>

    <div class="grain"></div>
    <div id="media-container">
        <video id="bg-video" muted loop playsinline></video>
        <img id="bg-image" alt="background">
    </div>
    <div class="bg-overlay"></div>

    <div id="secret-trigger" onclick="openLogin()"></div>

    <!-- P1: Landing -->
    <div id="screen-landing" class="screen active">
        <h1 id="view-title" class="text-6xl sm:text-9xl font-black tracking-tighter mb-2 leading-none">INNERSPEAKER</h1>
        <h2 id="view-subtitle" class="text-[10px] sm:text-lg font-light tracking-[0.6em] mb-24 opacity-60 uppercase">TAME IMPALA</h2>
        <button onclick="goTo('room')" class="btn-main">COMENZAR EXCURSIÓN</button>
        <p id="view-footer" class="text-[8px] mt-16 uppercase opacity-40 tracking-widest max-w-xs"></p>
    </div>

    <!-- P2: Room -->
    <div id="screen-room" class="screen">
        <h2 class="text-[10px] font-black uppercase tracking-[0.5em] mb-12 opacity-50">ELIGE 3 ANCLAS CON LA REALIDAD</h2>
        <div class="grid grid-cols-3 gap-4 w-full max-w-[340px]" id="objects-grid"></div>
        <p id="counter" class="mt-12 text-[9px] opacity-40 uppercase tracking-widest">0 / 3 SELECCIONADOS</p>
    </div>

    <!-- P3: Voice -->
    <div id="screen-voice" class="screen">
        <h2 class="text-[10px] font-black uppercase tracking-[0.5em] mb-16 opacity-50">¿CÓMO TE HABLA TU CONCIENCIA?</h2>
        <div class="flex flex-col gap-10">
            <button onclick="setVoice('kind')" class="voice-btn">En susurros amables</button>
            <button onclick="setVoice('critical')" class="voice-btn">Con verdades crudas</button>
        </div>
    </div>

    <!-- P4: Loading -->
    <div id="screen-loading" class="screen">
        <div class="w-16 h-16 border-2 border-white/5 border-t-orange-500 rounded-full animate-spin mb-8"></div>
        <p class="typewriter text-[11px] uppercase tracking-[0.3em] animate-pulse">PROCESANDO PSIQUE...</p>
    </div>

    <!-- P5: Result -->
    <div id="screen-result" class="screen">
        <div class="max-w-[360px] w-full flex flex-col items-center">
            <span class="text-[9px] font-black text-orange-500 tracking-[0.5em] mb-6 uppercase">RESULTADO DE TU VIAJE</span>
            <h3 id="res-title" class="text-5xl font-black uppercase tracking-tighter mb-6 leading-none text-center"></h3>
            <div class="w-12 h-[2px] bg-orange-500/50 mb-8"></div>
            <p id="res-desc" class="typewriter text-sm leading-relaxed mb-8 opacity-90 px-4"></p>
            <p id="res-critique" class="typewriter text-[10px] italic opacity-50 mb-12 border-t border-white/10 pt-8 px-6"></p>
            <a id="res-link" href="#" target="_blank" class="btn-main text-center">REPRODUCIR TRACK</a>
            <button onclick="location.reload()" class="text-[8px] uppercase tracking-widest opacity-30 mt-12 hover:opacity-100 transition">REINICIAR EXPERIENCIA</button>
        </div>
    </div>

    <!-- PANEL ADMIN -->
    <div id="admin-panel">
        <div class="p-6 bg-zinc-900 flex justify-between items-center border-b border-white/10">
            <h3 class="font-bold text-orange-500 text-sm">CONFIGURACIÓN DEL ÁLBUM</h3>
            <button onclick="closeAdmin()" class="text-xs opacity-50 uppercase">Cerrar</button>
        </div>
        <div class="admin-content" id="admin-form"></div>
        <div class="p-6 bg-zinc-900">
            <button id="save-btn" onclick="saveAdmin()" class="w-full bg-orange-600 py-4 font-bold text-xs uppercase rounded">Sincronizar Cambios</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'innerspeaker-pro-v4';
        
        // Mapeo lógico: Cada objeto tiene "afinidad" con ciertas canciones (0-10)
        const OBJ_MAP = {
            'Espejo': [0, 2, 7],      // It Is Not..., Alter Ego, Expectation
            'Ventana': [9, 5, 3],     // Runway..., Solitude..., Lucidity
            'Reloj': [8, 1, 4],       // Bold Arrow..., Desire Be..., Why Won't...
            'Libreta': [0, 10, 6],    // It Is Not..., I Don't Really Mind, Jeremy's Storm
            'Audífonos': [2, 5, 9],   // Alter Ego, Solitude..., Runway...
            'Vinilo': [1, 8, 3],      // Desire Be..., Bold Arrow..., Lucidity
            'Cama': [10, 0, 7],       // I Don't Really Mind, It Is Not..., Expectation
            'Lámpara': [3, 4, 2],     // Lucidity, Why Won't..., Alter Ego
            'Silla': [5, 6, 1]        // Solitude..., Jeremy's Storm, Desire Be...
        };

        let config = {
            title: "INNERSPEAKER",
            subtitle: "TAME IMPALA",
            footer: "UNA EXPLORACIÓN PSICODÉLICA SOBRE EL ÁLBUM DE 2010",
            bgUrl: "https://cdn.pixabay.com/video/2024/08/05/224962_large.mp4",
            songs: [
                { id: 0, title: "It Is Not Meant To Be", desc: "Sientes que el mundo gira mientras tú estás quieto.", crit: "A veces el universo simplemente dice que no.", url: "https://youtu.be/3a7jLiSCtfU" },
                { id: 1, title: "Desire Be Desire Go", desc: "Un impulso frenético por avanzar sin mirar atrás.", crit: "Tus deseos te están consumiendo, cuidado.", url: "https://youtu.be/Mc8LpXv_Xv0" },
                { id: 2, title: "Alter Ego", desc: "La confrontación final con quien crees que eres.", crit: "La única persona que te detiene es tu reflejo.", url: "https://youtu.be/VpLXxFhy7s4" },
                { id: 3, title: "Lucidity", desc: "Un momento de claridad en medio del ruido.", crit: "La verdad es brillante, pero quema.", url: "https://youtu.be/fM_LIsA3vH8" },
                { id: 4, title: "Why Won't You Make Up Your Mind?", desc: "El bucle infinito de la indecisión.", crit: "Elige un camino o el camino te elegirá a ti.", url: "https://youtu.be/Mv07Quv60S4" },
                { id: 5, title: "Solitude Is Bliss", desc: "El placer absoluto de no necesitar a nadie.", crit: "Estar solo no es lo mismo que sentirse solo.", url: "https://youtu.be/N7eGu_p2jLk" },
                { id: 6, title: "Jeremy's Storm", desc: "Un caos instrumental que precede a la calma.", crit: "Hay belleza en el desorden total.", url: "https://youtu.be/XyS0_eYp8X4" },
                { id: 7, title: "Expectation", desc: "El peso de lo que debería ser frente a lo que es.", crit: "Tus expectativas son tu propia jaula.", url: "https://youtu.be/i6Hm8SJF668" },
                { id: 8, title: "The Bold Arrow of Time", desc: "El blues del pasado chocando con el futuro.", crit: "El tiempo no perdona a los nostálgicos.", url: "https://youtu.be/K-8C0q_97G8" },
                { id: 9, title: "Runway, Houses, City, Clouds", desc: "La perspectiva definitiva desde las alturas.", crit: "Todo se ve insignificante desde aquí arriba.", url: "https://youtu.be/Yp83uUv96vI" },
                { id: 10, title: "I Don't Really Mind", desc: "La rendición final ante la apatía positiva.", crit: "Si nada importa, todo es posible.", url: "https://youtu.be/E-i_FNoV94E" }
            ]
        };

        let db, auth, user, selected = [];

        async function init() {
            try {
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                };
                await initAuth();

                onAuthStateChanged(auth, u => {
                    user = u;
                    if (u) {
                        onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'main'), snap => {
                            if (snap.exists()) { config = snap.data(); apply(); }
                        });
                    }
                });
            } catch (e) { apply(); }
            setupUI();
        }

        function apply() {
            document.getElementById('view-title').innerText = config.title;
            document.getElementById('view-subtitle').innerText = config.subtitle;
            document.getElementById('view-footer').innerText = config.footer;

            const video = document.getElementById('bg-video');
            const img = document.getElementById('bg-image');
            const url = config.bgUrl || "";
            const isVideo = url.match(/\.(mp4|webm|ogg)$/) || url.includes('pixabay.com/video');

            if (isVideo) {
                img.style.opacity = "0";
                if (video.src !== url) video.src = url;
                video.style.opacity = "1";
                video.play().catch(() => {});
            } else {
                video.style.opacity = "0";
                img.src = url;
                img.style.opacity = "1";
            }
        }

        function setupUI() {
            const grid = document.getElementById('objects-grid');
            if (!grid) return;
            grid.innerHTML = '';
            Object.keys(OBJ_MAP).forEach(obj => {
                const btn = document.createElement('button');
                btn.className = 'object-btn'; btn.innerText = obj;
                btn.onclick = () => {
                    if (selected.includes(obj)) {
                        selected = selected.filter(x => x !== obj);
                        btn.classList.remove('selected');
                    } else if (selected.length < 3) {
                        selected.push(obj);
                        btn.classList.add('selected');
                        if (selected.length === 3) setTimeout(() => goTo('voice'), 400);
                    }
                    document.getElementById('counter').innerText = `${selected.length} / 3 SELECCIONADOS`;
                };
                grid.appendChild(btn);
            });
        }

        window.goTo = (id) => {
            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('active');
                setTimeout(() => s.style.display = 'none', 800);
            });
            setTimeout(() => {
                const target = document.getElementById(`screen-${id}`);
                target.style.display = 'flex';
                setTimeout(() => target.classList.add('active'), 50);
            }, 850);
        };

        window.setVoice = (vType) => {
            goTo('loading');
            setTimeout(() => {
                // MECÁNICA: Calcular canción basada en afinidad de objetos
                const scores = new Array(11).fill(0);
                selected.forEach(obj => {
                    OBJ_MAP[obj].forEach(songId => scores[songId] += 1);
                });
                
                // Encontrar el índice con más votos (o el último si hay empate)
                let maxScore = -1;
                let songIndex = 0;
                scores.forEach((s, i) => {
                    if (s >= maxScore) { maxScore = s; songIndex = i; }
                });

                const song = config.songs[songIndex];
                document.getElementById('res-title').innerText = song.title;
                document.getElementById('res-desc').innerText = song.desc;
                document.getElementById('res-critique').innerText = vType === 'kind' ? "SUSURRO: " + song.crit : "CRÍTICA: " + song.crit;
                document.getElementById('res-link').href = song.url;
                goTo('result');
            }, 2500);
        };

        window.openLogin = () => {
            if (prompt("Acceso:") === 'notasdazul') {
                document.getElementById('admin-panel').classList.add('open');
                renderAdmin();
            }
        };
        
        window.closeAdmin = () => document.getElementById('admin-panel').classList.remove('open');

        function renderAdmin() {
            const form = document.getElementById('admin-form');
            let html = `
                <div class="mb-8">
                    <label class="text-[10px] uppercase opacity-40 block mb-2">Fondo General (URL MP4 o Imagen)</label>
                    <input type="text" id="in-bg" class="admin-input" value="${config.bgUrl}">
                </div>
                <h4 class="text-orange-500 font-bold text-xs mb-4 border-b border-white/10 pb-2">CONTENIDO DEL ÁLBUM</h4>
            `;
            
            config.songs.forEach((s, i) => {
                html += `
                    <div class="mb-6 p-4 bg-white/5 rounded-lg">
                        <span class="text-[9px] opacity-30 block mb-2">TRACK #${i+1}</span>
                        <input type="text" id="song-t-${i}" class="admin-input" placeholder="Título" value="${s.title}">
                        <textarea id="song-d-${i}" class="admin-input h-20" placeholder="Descripción">${s.desc}</textarea>
                        <input type="text" id="song-u-${i}" class="admin-input mb-0" placeholder="Link YouTube" value="${s.url}">
                    </div>
                `;
            });
            form.innerHTML = html;
        }

        window.saveAdmin = async () => {
            if (!user) return alert("Espera a la autenticación...");
            const btn = document.getElementById('save-btn');
            btn.innerText = "SINCRONIZANDO...";
            
            const updatedSongs = config.songs.map((s, i) => ({
                id: i,
                title: document.getElementById(`song-t-${i}`).value,
                desc: document.getElementById(`song-d-${i}`).value,
                crit: s.crit, // Mantenemos la crítica original o podrías añadir input para ella
                url: document.getElementById(`song-u-${i}`).value
            }));

            const newConfig = { ...config, bgUrl: document.getElementById('in-bg').value, songs: updatedSongs };

            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'main'), newConfig);
                alert("Base de datos actualizada.");
                closeAdmin();
            } catch(e) { alert(e.message); }
            finally { btn.innerText = "Sincronizar Cambios"; }
        };

        init();
    </script>
</body>
</html>
