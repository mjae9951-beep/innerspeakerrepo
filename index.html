<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Innerspeaker Experience - 11 Tracks Edition</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        
        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background-color: #000; 
            color: white; 
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
        }

        .bg-video, .bg-image {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        .admin-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 0.6rem;
            border-radius: 0.4rem;
            width: 100%;
            font-size: 0.75rem;
            outline: none;
            transition: all 0.2s;
        }
        .admin-input:focus { border-color: #f59e0b; background: rgba(255, 255, 255, 0.1); }

        .objects-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 800px;
        }

        @media (max-width: 640px) {
            .objects-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
        }

        .object-btn {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            text-transform: uppercase;
            font-weight: 900;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 8px;
            padding: 4px;
            font-size: 10px;
        }

        .object-btn.active {
            transform: scale(0.95);
            background: white;
            color: black;
            box-shadow: 0 0 30px rgba(255,255,255,0.3);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        
        .sync-bar {
            height: 3px;
            transition: width 0.4s ease;
        }

        @keyframes pulse-sync {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .syncing { animation: pulse-sync 1s infinite; }
        
        .voice-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .voice-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: white;
            transform: translateY(-5px);
        }

        .admin-section {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCXcM54HHeambvpHkJY1-N1G3Q7UPcPOj8",
            authDomain: "innerspeaker-568f3.firebaseapp.com",
            projectId: "innerspeaker-568f3",
            storageBucket: "innerspeaker-568f3.firebasestorage.app",
            messagingSenderId: "945238998266",
            appId: "1:945238998266:web:661d0080b0d42cb7a59d43"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'innerspeaker-v11-final'; 
        const ADMIN_PASS = "raiden";
        const LOCAL_CONFIG_KEY = 'innerspeaker-local-config';

        const INITIAL_DATA = {
            appearance: {
                backgroundType: 'color',
                backgroundUrl: '',
                bgColor: '#000000',
                overlayOpacity: 0.6,
                textColor: '#ffffff',
                accentColor: '#f59e0b'
            },
            texts: {
                welcomeTitle: "Innerspeaker",
                welcomeSub: "Experiencia Sonora Inmersiva",
                btnStart: "Comenzar",
                selectionTitle: "Selecciona 3 elementos de tu entorno",
                voiceQuestion: "¿Cómo suena tu voz interior hoy?",
                voiceAmable: "Amable y Compasiva",
                voiceCritica: "Crítica y Analítica",
                loadingMsg: "Sintonizando tu frecuencia interior...",
                resultTitle: "Tu Frecuencia:",
                btnYoutube: "Escuchar en YouTube",
                selectedCountLabel: "Seleccionados",
                btnBackHome: "Volver al inicio",
                btnBackObjects: "Volver a elegir objetos",
                btnRestart: "Reiniciar Viaje",
                statusConnecting: "conectando",
                statusConnected: "conectado",
                statusAuthError: "error auth",
                statusDbError: "error db",
                statusNoSession: "sin sesión"
            },
            objects: [
                { id: 1, name: "Cámara", song: "It Is Not Meant to Be", url: "https://youtu.be/b0S6I0C2m-o", weight: 90, description: "Texturas lo-fi y saturación analógica." },
                { id: 2, name: "Prisma", song: "Desire Be Desire Go", url: "https://youtu.be/W-LpYtQY2pU", weight: 80, description: "Refracción de ondas rítmicas." },
                { id: 3, name: "Hojas", song: "Alter Ego", url: "https://youtu.be/bBSropdYUtw", weight: 70, description: "Capas orgánicas psicodélicas." },
                { id: 4, name: "Cassette", song: "Lucidity", url: "https://youtu.be/AdBlnmD7Ios", weight: 60, description: "Compresión armónica introspectiva." },
                { id: 5, name: "Humo", song: "Why Won't You Make Up Your Mind?", url: "https://youtu.be/mD9vUofHeYc", weight: 50, description: "Delays atmosféricos definidos." },
                { id: 6, name: "Espejo", song: "Solitude Is Bliss", url: "https://youtu.be/vxvf7gR4-2w", weight: 40, description: "Sonido espacial con reverb abierta." },
                { id: 7, name: "Arena", song: "Jeremy's Storm", url: "https://youtu.be/0wL0M4tI0Lg", weight: 30, description: "Tormenta de sintetizadores instrumentales." },
                { id: 8, name: "Neón", song: "Expectation", url: "https://youtu.be/i9vVlO-H9nE", weight: 25, description: "Estética sonora vibrante y pulsante." },
                { id: 9, name: "Ojo", song: "The Bold Arrow of Time", url: "https://youtu.be/A2C6N8TndH8", weight: 15, description: "Riffs crudos con distorsión clásica." },
                { id: 10, name: "Reloj", song: "Runway, Houses, City, Clouds", url: "https://youtu.be/9M_B_A-C39Y", weight: 10, description: "Evolución sónica a través del tiempo." },
                { id: 11, name: "Cielo", song: "I Don't Really Mind", url: "https://youtu.be/0G6p0XmIe4w", weight: 5, description: "Cierre etéreo con texturas de sintetizador." }
            ]
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = React.useRef(null);
            React.useLayoutEffect(() => {
                const el = iconRef.current;
                if (window.lucide && el) {
                    el.innerHTML = '';
                    const iconElement = document.createElement('i');
                    iconElement.setAttribute('data-lucide', name);
                    iconElement.className = className;
                    iconElement.style.width = `${size}px`;
                    iconElement.style.height = `${size}px`;
                    el.appendChild(iconElement);
                    window.lucide.createIcons({ nameAttr: 'data-lucide' });
                }
                return () => { if (el) el.innerHTML = ''; };
            }, [name, size, className]);
            return <span ref={iconRef} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: size, height: size }}></span>;
        };

        const mergeConfigWithDefaults = (incoming = {}) => ({
            appearance: { ...INITIAL_DATA.appearance, ...(incoming.appearance || {}) },
            texts: { ...INITIAL_DATA.texts, ...(incoming.texts || {}) },
            objects: Array.isArray(incoming.objects) && incoming.objects.length
                ? incoming.objects.map((obj, idx) => ({ ...INITIAL_DATA.objects[idx], ...obj }))
                : INITIAL_DATA.objects
        });

        function App() {
            const [user, setUser] = React.useState(null);
            const [config, setConfig] = React.useState(INITIAL_DATA);
            const [screen, setScreen] = React.useState('home');
            const [selected, setSelected] = React.useState([]);
            const [voiceType, setVoiceType] = React.useState(null); 
            const [isAdmin, setIsAdmin] = React.useState(false);
            const [adminPass, setAdminPass] = React.useState("");
            const [isAuthed, setIsAuthed] = React.useState(false);
            const [syncStatus, setSyncStatus] = React.useState('saved');
            const [loadStatus, setLoadStatus] = React.useState('connecting');
            
            const settingsDocRef = doc(db, 'artifacts', appId, 'public', 'data');

            React.useEffect(() => {
                const initAuth = async () => {
                    try {
                        await signInAnonymously(auth);
                    } catch (e) {
                        console.error(e);
                        setLoadStatus('auth-error');
                    }
                };
                initAuth();
                const unsubscribeAuth = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                    if (currentUser) setLoadStatus('connected');
                });
                return () => unsubscribeAuth();
            }, []);

            React.useEffect(() => {
                if (user) return;
                try {
                    const localConfig = localStorage.getItem(LOCAL_CONFIG_KEY);
                    if (localConfig) setConfig(mergeConfigWithDefaults(JSON.parse(localConfig)));
                } catch (e) {
                    console.error(e);
                }
            }, [user]);

            React.useEffect(() => {
                if (!user) return;
                const unsubscribeSnap = onSnapshot(settingsDocRef, (s) => {
                    if (s.exists()) setConfig(mergeConfigWithDefaults(s.data()));
                    else setDoc(settingsDocRef, INITIAL_DATA);
                    if (loadStatus !== 'auth-error') setLoadStatus('connected');
                }, (e) => {
                    console.error(e);
                    setLoadStatus('firestore-error');
                });
                return () => unsubscribeSnap();
            }, [user]);

            const saveToCloud = async (newConfig) => {
                if (!user) {
                    setSyncStatus('error');
                    setLoadStatus('auth-error');
                    return;
                }

                setSyncStatus('syncing');
                try {
                    await setDoc(settingsDocRef, newConfig);
                    try { localStorage.setItem(LOCAL_CONFIG_KEY, JSON.stringify(newConfig)); } catch (e) { console.error(e); }
                    setSyncStatus('saved');
                } catch (e) {
                    console.error(e);
                    setSyncStatus('error');
                    setLoadStatus('firestore-error');
                }
            };

            const getResult = () => {
                if (selected.length === 0) return config.objects[0];
                const voiceModifier = voiceType === 'amable' ? 10 : -10;
                const avg = (selected.reduce((a, b) => a + b.weight, 0) / selected.length) + voiceModifier;
                return config.objects.reduce((p, c) => Math.abs(c.weight - avg) < Math.abs(p.weight - avg) ? c : p);
            };

            const displayWelcomeTitle = (config.texts.welcomeTitle || '').trim().toLowerCase() === 'innespeaker'
                ? 'Innerspeaker'
                : config.texts.welcomeTitle;

            const Layout = ({ children, animate = true }) => (
                <div className="relative min-h-screen w-full flex flex-col items-center justify-center p-4 text-center overflow-hidden" style={{ color: config.appearance.textColor }}>
                    {config.appearance.backgroundType === 'video' && config.appearance.backgroundUrl && (
                        <video key={config.appearance.backgroundUrl} autoPlay muted loop playsInline className="bg-video">
                            <source src={config.appearance.backgroundUrl}/>
                        </video>
                    )}
                    {config.appearance.backgroundType === 'image' && config.appearance.backgroundUrl && (
                        <div className="bg-image" style={{ backgroundImage: `url(${config.appearance.backgroundUrl})`, backgroundSize: 'cover', backgroundPosition: 'center' }} />
                    )}
                    {config.appearance.backgroundType === 'color' && (
                        <div className="bg-image" style={{ backgroundColor: config.appearance.bgColor }} />
                    )}
                    <div className="absolute inset-0 z-0 pointer-events-none" style={{ background: `rgba(0,0,0,${config.appearance.overlayOpacity})` }} />
                    <div className={`z-10 w-full max-w-4xl ${animate ? 'animate-in fade-in zoom-in duration-700' : ''}`}>{children}</div>
                    
                    {!isAdmin && (
                        <>
                            <div className="fixed bottom-4 left-4 z-50 text-[9px] uppercase tracking-[0.2em] px-3 py-2 rounded-full border border-white/20 bg-black/40">
                                Estado: {user ? (loadStatus === 'connected' ? config.texts.statusConnected : loadStatus === 'firestore-error' ? config.texts.statusDbError : config.texts.statusConnecting) : (loadStatus === 'auth-error' ? config.texts.statusNoSession : config.texts.statusConnecting)}
                            </div>
                            <button onClick={() => setIsAdmin(true)} className="fixed bottom-4 right-4 opacity-30 hover:opacity-100 z-50 p-2">
                                <Icon name="settings" size={16}/>
                            </button>
                        </>
                    )}
                </div>
            );

            React.useEffect(() => {
                if (screen !== 'loading') return undefined;
                const timer = setTimeout(() => setScreen('reveal'), 2500);
                return () => clearTimeout(timer);
            }, [screen]);

            if (isAdmin) return (
                <div className="fixed inset-0 z-[100] bg-zinc-950 text-white flex flex-col items-center justify-start overflow-y-auto custom-scrollbar p-4 md:p-10">
                    <div className="w-full h-1 bg-white/5 fixed top-0 left-0 z-50">
                        <div className={`sync-bar ${syncStatus === 'syncing' ? 'bg-amber-500 syncing' : syncStatus === 'error' ? 'bg-red-500' : 'bg-green-500'}`} 
                             style={{ width: syncStatus === 'syncing' ? '60%' : '100%' }} />
                    </div>

                    {!isAuthed ? (
                        <div className="h-[80vh] flex flex-col items-center justify-center space-y-4">
                            <Icon name="lock" size={40} className="text-amber-500 mb-4" />
                            <input type="password" value={adminPass} onChange={e => setAdminPass(e.target.value)} onKeyDown={e => e.key === 'Enter' && adminPass === ADMIN_PASS && setIsAuthed(true)} className="admin-input text-center py-4 w-64" placeholder="CONTRASEÑA" />
                            <button onClick={() => adminPass === ADMIN_PASS && setIsAuthed(true)} className="bg-white text-black font-black py-4 px-12 uppercase text-[10px]">Acceder</button>
                            <button onClick={() => setIsAdmin(false)} className="text-[10px] opacity-30 uppercase font-bold">Cerrar</button>
                        </div>
                    ) : (
                        <div className="w-full max-w-5xl animate-in fade-in duration-500 pb-20">
                            <div className="flex justify-between items-center py-6 sticky top-0 bg-zinc-950 z-40 border-b border-white/10 mb-8">
                                <h2 className="font-black text-2xl uppercase italic tracking-tighter">Innerspeaker <span className="text-amber-500 text-sm align-top">CMS</span></h2>
                                <button onClick={() => { setIsAdmin(false); setIsAuthed(false); }} className="bg-white text-black px-6 py-2 font-black text-[10px] uppercase rounded-full">Salir</button>
                            </div>

                            <div className="admin-section">
                                <h3 className="font-black text-xs uppercase mb-6 flex items-center gap-2" style={{ color: config.appearance.accentColor }}><Icon name="palette" size={14}/> Fondo y Estética</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="space-y-2">
                                        <label className="text-[10px] uppercase font-bold opacity-40">Tipo de Fondo</label>
                                        <select className="admin-input" value={config.appearance.backgroundType} onChange={e => {
                                            const nc = {...config, appearance: {...config.appearance, backgroundType: e.target.value}};
                                            setConfig(nc); saveToCloud(nc);
                                        }}>
                                            <option value="color">Color Sólido</option>
                                            <option value="image">Imagen URL</option>
                                            <option value="video">Video URL</option>
                                        </select>
                                    </div>
                                    <div className="space-y-2 md:col-span-2">
                                        <label className="text-[10px] uppercase font-bold opacity-40">URL / Color Hex</label>
                                        <input className="admin-input" value={config.appearance.backgroundType === 'color' ? config.appearance.bgColor : config.appearance.backgroundUrl} 
                                               onChange={e => {
                                                   const key = config.appearance.backgroundType === 'color' ? 'bgColor' : 'backgroundUrl';
                                                   const nc = {...config, appearance: {...config.appearance, [key]: e.target.value}};
                                                   setConfig(nc); saveToCloud(nc);
                                               }} />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] uppercase font-bold opacity-40">Opacidad Overlay ({config.appearance.overlayOpacity})</label>
                                        <input type="range" min="0" max="0.95" step="0.05" className="w-full" value={config.appearance.overlayOpacity}
                                               onChange={e => {
                                                   const nc = {...config, appearance: {...config.appearance, overlayOpacity: Number(e.target.value)}};
                                                   setConfig(nc); saveToCloud(nc);
                                               }} />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] uppercase font-bold opacity-40">Color del texto</label>
                                        <input type="color" className="admin-input h-11" value={config.appearance.textColor}
                                               onChange={e => {
                                                   const nc = {...config, appearance: {...config.appearance, textColor: e.target.value}};
                                                   setConfig(nc); saveToCloud(nc);
                                               }} />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] uppercase font-bold opacity-40">Color de acento</label>
                                        <input type="color" className="admin-input h-11" value={config.appearance.accentColor}
                                               onChange={e => {
                                                   const nc = {...config, appearance: {...config.appearance, accentColor: e.target.value}};
                                                   setConfig(nc); saveToCloud(nc);
                                               }} />
                                    </div>
                                </div>
                            </div>

                            <div className="admin-section">
                                <h3 className="font-black text-xs uppercase mb-6 flex items-center gap-2" style={{ color: config.appearance.accentColor }}><Icon name="type" size={14}/> Textos de la Experiencia</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {Object.entries(config.texts).map(([key, value]) => (
                                        <div key={key}>
                                            <label className="text-[8px] opacity-40 uppercase font-bold">{key}</label>
                                            <input className="admin-input" value={value} onChange={e => {
                                                const nt = { ...config.texts, [key]: e.target.value };
                                                const nc = { ...config, texts: nt };
                                                setConfig(nc); saveToCloud(nc);
                                            }} />
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="admin-section">
                                <h3 className="font-black text-xs uppercase mb-6 flex items-center gap-2" style={{ color: config.appearance.accentColor }}><Icon name="music" size={14}/> Las 11 Canciones (Objetos)</h3>
                                <div className="space-y-4">
                                    {config.objects.map((obj, idx) => (
                                        <div key={obj.id} className="bg-white/5 p-4 rounded-xl border border-white/5">
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-3">
                                                <div>
                                                    <label className="text-[8px] opacity-40 uppercase font-bold">Objeto {idx+1}</label>
                                                    <input className="admin-input" value={obj.name} onChange={e => {
                                                        const no = [...config.objects]; no[idx].name = e.target.value;
                                                        const nc = {...config, objects: no}; setConfig(nc); saveToCloud(nc);
                                                    }} />
                                                </div>
                                                <div>
                                                    <label className="text-[8px] opacity-40 uppercase font-bold">Canción</label>
                                                    <input className="admin-input font-bold" value={obj.song} onChange={e => {
                                                        const no = [...config.objects]; no[idx].song = e.target.value;
                                                        const nc = {...config, objects: no}; setConfig(nc); saveToCloud(nc);
                                                    }} />
                                                </div>
                                                <div>
                                                    <label className="text-[8px] opacity-40 uppercase font-bold">YouTube URL</label>
                                                    <input className="admin-input" value={obj.url} onChange={e => {
                                                        const no = [...config.objects]; no[idx].url = e.target.value;
                                                        const nc = {...config, objects: no}; setConfig(nc); saveToCloud(nc);
                                                    }} />
                                                </div>
                                            </div>
                                            <label className="text-[8px] opacity-40 uppercase font-bold">Descripción del resultado</label>
                                            <input className="admin-input" value={obj.description} onChange={e => {
                                                const no = [...config.objects]; no[idx].description = e.target.value;
                                                const nc = {...config, objects: no}; setConfig(nc); saveToCloud(nc);
                                            }} />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );

            if (screen === 'home') return (
                <Layout>
                    <div className="w-full max-w-3xl mx-auto flex flex-col items-center justify-center text-center">
                        <h1 className="mx-auto w-full text-[3.2rem] sm:text-7xl md:text-[9rem] font-black uppercase tracking-tight leading-[0.92] mb-6 italic text-center">{displayWelcomeTitle}</h1>
                    <p className="mx-auto w-full text-[11px] uppercase tracking-[0.28em] font-bold opacity-70 mb-14 text-center">{config.texts.welcomeSub}</p>
                        <button onClick={() => setScreen('select')} className="bg-white text-black font-black uppercase text-xs px-16 py-6 hover:scale-110 transition-transform rounded-full">{config.texts.btnStart}</button>
                    </div>
                </Layout>
            );

            if (screen === 'select') return (
                <Layout>
                    <h2 className="text-[11px] font-black uppercase tracking-[0.3em] opacity-40 mb-4">{config.texts.selectionTitle}</h2>
                    <p className="text-xs uppercase tracking-[0.2em] mb-8" style={{ color: config.appearance.accentColor }}>
                        {config.texts.selectedCountLabel}: {selected.length}/3
                    </p>
                    <div className="flex justify-center w-full px-4 mb-16">
                        <div className="objects-grid">
                            {config.objects.map(obj => {
                                const active = selected.some(s => s.id === obj.id);
                                return (
                                    <button key={obj.id} disabled={selected.length >= 3 && !active}
                                        onClick={() => {
                                            if (active) setSelected(selected.filter(s => s.id !== obj.id));
                                            else if (selected.length < 3) {
                                                const newList = [...selected, obj];
                                                setSelected(newList);
                                                if (newList.length === 3) setTimeout(() => setScreen('voice'), 400);
                                            }
                                        }} className={`object-btn ${active ? 'active' : 'bg-black/40 text-white opacity-70 hover:opacity-100'}`}>
                                        {obj.name}
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                    <button onClick={() => { setSelected([]); setScreen('home'); }} className="mt-8 text-[10px] uppercase tracking-[0.3em] opacity-50 hover:opacity-100">{config.texts.btnBackHome}</button>
                </Layout>
            );

            if (screen === 'voice') return (
                <Layout>
                    <h2 className="text-4xl md:text-5xl font-black italic uppercase tracking-tighter mb-12 leading-none">{config.texts.voiceQuestion}</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-2xl mx-auto w-full px-4">
                        <button onClick={() => { setVoiceType('amable'); setScreen('loading'); }} className="voice-card p-10 rounded-3xl flex flex-col items-center gap-4 group">
                            <Icon name="heart" size={32} className="text-amber-500 group-hover:scale-110 transition-transform" />
                            <span className="font-black uppercase italic text-xl leading-tight">{config.texts.voiceAmable}</span>
                        </button>
                        <button onClick={() => { setVoiceType('critica'); setScreen('loading'); }} className="voice-card p-10 rounded-3xl flex flex-col items-center gap-4 group">
                            <Icon name="activity" size={32} className="text-blue-400 group-hover:scale-110 transition-transform" />
                            <span className="font-black uppercase italic text-xl leading-tight">{config.texts.voiceCritica}</span>
                        </button>
                    </div>
                    <button onClick={() => setScreen('select')} className="mt-8 text-[10px] uppercase tracking-[0.3em] opacity-50 hover:opacity-100">{config.texts.btnBackObjects}</button>
                </Layout>
            );

            if (screen === 'loading') {
                return (
                    <Layout animate={false}>
                        <div className="space-y-8 flex flex-col items-center">
                            <div className="w-20 h-20 border-t-2 border-white rounded-full animate-spin opacity-20" />
                            <p className="text-xl md:text-2xl font-black italic uppercase tracking-[0.2em] animate-pulse">{config.texts.loadingMsg}</p>
                        </div>
                    </Layout>
                );
            }

            if (screen === 'reveal') {
                const res = getResult();
                return (
                    <Layout>
                        <h3 className="text-[10px] font-black uppercase tracking-[0.6em] opacity-40 mb-6">{config.texts.resultTitle}</h3>
                        <h2 className="text-6xl md:text-8xl font-black uppercase tracking-tighter leading-tight mb-12 italic drop-shadow-lg">{res.song}</h2>
                        <div className="max-w-2xl mx-auto bg-white/5 backdrop-blur-xl border border-white/10 p-10 rounded-[2rem] mb-12 text-left">
                            <p className="text-sm md:text-lg font-medium opacity-80 italic">"{res.description}"</p>
                        </div>
                        <div className="flex flex-col md:flex-row gap-6 justify-center items-center">
                            <a href={res.url} target="_blank" className="bg-white text-black px-12 py-6 font-black uppercase text-[11px] flex items-center justify-center gap-4 hover:scale-105 transition-transform">
                                <Icon name="external-link" size={16} /> {config.texts.btnYoutube}
                            </a>
                            <button onClick={() => { setScreen('home'); setSelected([]); setVoiceType(null); }} className="text-[10px] font-black uppercase opacity-30 hover:opacity-100 tracking-widest border-b border-white/20 pb-1">{config.texts.btnRestart}</button>
                        </div>
                    </Layout>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
