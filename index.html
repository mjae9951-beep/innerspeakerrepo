<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Innerspeaker - Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Permanent+Marker&family=Inter:wght@200;300;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0d1b1a; 
            --leaf-green: #4b6a4a;
            --autumn-orange: #c87c4a;
            --text-off: #e8e4d9;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-deep);
            color: var(--text-off);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }

        .grain {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.12; pointer-events: none; z-index: 50;
        }

        .bg-layer {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 100%, var(--autumn-orange) -20%, var(--leaf-green) 40%, var(--bg-deep) 90%);
            z-index: -2; transition: opacity 1.5s ease;
        }

        #bg-video {
            position: fixed; inset: 0; width: 100%; height: 100%;
            z-index: -3; object-fit: cover; opacity: 0.4; transition: opacity 2s ease;
        }

        .screen {
            position: fixed; inset: 0;
            display: none; flex-direction: column; align-items: center;
            justify-content: center; padding: 1.5rem;
            text-align: center; opacity: 0;
            transition: opacity 0.6s ease; z-index: 10;
        }

        .screen.active { display: flex; opacity: 1; }

        .object-btn {
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase;
            border-radius: 8px; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            padding: 10px; box-sizing: border-box;
        }

        .object-btn.selected { 
            background: var(--autumn-orange); color: white; 
            border-color: rgba(255,255,255,0.4); transform: scale(0.92); 
        }

        .voice-btn { 
            font-family: 'Permanent Marker', cursive; 
            font-size: 2.2rem; transition: transform 0.3s; 
            outline: none; -webkit-tap-highlight-color: transparent;
        }
        
        .voice-btn:active { transform: scale(0.9); color: var(--autumn-orange); }

        .btn-main {
            border: 1px solid var(--text-off); padding: 1.1rem 2rem;
            text-transform: uppercase; font-weight: 900; letter-spacing: 0.25em;
            font-size: 0.7rem; transition: all 0.3s;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
            width: 100%; max-width: 260px;
        }

        .typewriter { font-family: 'Special Elite', serif; }

        /* Disparador del panel admin (esquina inferior derecha) */
        #secret-trigger { 
            position: fixed; bottom: 0; right: 0; width: 80px; height: 80px; 
            z-index: 100; opacity: 0; cursor: pointer;
        }

        #admin-panel {
            position: fixed; top: 0; right: -100%; width: 100%; height: 100%;
            background: #0d0d0d; color: #eee; z-index: 200; transition: 0.4s ease;
            display: flex; flex-direction: column;
        }
        #admin-panel.open { right: 0; }
        .admin-content { flex: 1; overflow-y: auto; padding: 1.5rem; padding-bottom: 5rem; }

        .tree {
            position: absolute; width: 100px; height: 100px;
            color: rgba(0, 0, 0, 0.15); pointer-events: none; z-index: -1;
        }
        @keyframes zoomTree {
            0% { transform: scale(0.2) rotate(0deg); opacity: 0; }
            20% { opacity: 0.3; }
            100% { transform: scale(5) rotate(10deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="grain"></div>
    <!-- Video de Pixabay cargado directamente -->
    <video id="bg-video" autoplay muted loop playsinline src="https://cdn.pixabay.com/video/2024/08/05/224962_large.mp4"></video>
    <div class="bg-layer" id="dynamic-bg"></div>
    <div id="trees-container"></div>

    <div id="secret-trigger" onclick="openLogin()"></div>

    <div id="screen-landing" class="screen active">
        <div class="flex flex-col items-center">
            <h1 id="editable-title" class="text-5xl sm:text-9xl font-black tracking-tighter mb-2 leading-none">INNERSPEAKER</h1>
            <h2 id="editable-subtitle" class="text-xs sm:text-2xl font-light tracking-[0.4em] mb-20 opacity-70 uppercase">TAME IMPALA</h2>
            <button onclick="goTo('room')" class="btn-main">ENTRAR</button>
            <p id="status-text" class="text-[8px] sm:text-[10px] mt-16 uppercase opacity-40 tracking-widest px-8 max-w-xs leading-relaxed"></p>
        </div>
    </div>

    <div id="screen-room" class="screen">
        <h2 id="text-room-header" class="text-[9px] font-black uppercase tracking-[0.4em] mb-10 opacity-60">CONSTRUCCIÓN DEL ENTORNO</h2>
        <div class="grid grid-cols-3 gap-3 w-full max-w-[320px] aspect-square" id="objects-grid"></div>
        <p id="room-instruction" class="mt-12 text-[9px] opacity-40 uppercase tracking-widest px-6">ELIGE 3 ELEMENTOS QUE DEFINAN TU AHORA</p>
    </div>

    <div id="screen-voice" class="screen">
        <h2 id="text-voice-header" class="text-[9px] font-black uppercase tracking-[0.4em] mb-16 opacity-60">SINTONÍA DE CONCIENCIA</h2>
        <div class="flex flex-col gap-12">
            <button onclick="setVoice('kind')" id="text-voice-kind" class="voice-btn">Amable</button>
            <div class="h-[1px] bg-white/10 w-24 mx-auto"></div>
            <button onclick="setVoice('critical')" id="text-voice-critical" class="voice-btn">Crítica</button>
        </div>
    </div>

    <div id="screen-loading" class="screen">
        <div class="w-10 h-10 border-2 border-white/5 border-t-orange-500 rounded-full animate-spin mb-8"></div>
        <p id="loading-msg" class="typewriter text-[9px] uppercase tracking-[0.3em] animate-pulse px-6">PROCESANDO RESONANCIA ARMÓNICA...</p>
    </div>

    <!-- Pantalla de Resultados Optimizada -->
    <div id="screen-result" class="screen">
        <div class="max-w-md w-full px-6 flex flex-col items-center justify-center">
            <p class="text-[9px] font-black text-orange-500 uppercase tracking-[0.3em] mb-6">RESONANCIA ENCONTRADA</p>
            
            <h3 id="res-title" class="text-4xl sm:text-6xl font-black uppercase tracking-tighter mb-6 leading-none text-center"></h3>
            
            <div class="h-[1px] bg-white/20 w-12 mb-8"></div>
            
            <p id="res-desc" class="typewriter text-xs sm:text-sm leading-relaxed mb-6 opacity-90 text-center max-w-[280px]"></p>
            
            <p id="res-critique" class="typewriter text-[10px] sm:text-[11px] italic opacity-40 mb-12 text-center border-t border-white/10 pt-6 px-4"></p>
            
            <div class="flex flex-col gap-4 w-full items-center">
                <a id="res-link" href="#" target="_blank" class="btn-main text-center">ESCUCHAR AHORA</a>
                <button onclick="location.reload()" class="text-[8px] uppercase font-bold opacity-30 mt-6 tracking-[0.4em] hover:opacity-100 transition">REINICIAR VIAJE</button>
            </div>
        </div>
    </div>

    <div id="admin-panel">
        <div class="p-6 bg-[#111] border-b border-white/10 flex justify-between items-center">
            <h2 class="font-black text-orange-500 uppercase tracking-tighter">Configuración</h2>
            <button onclick="closeAdmin()" class="text-xs uppercase font-bold">Cerrar</button>
        </div>
        <div class="admin-content">
            <label class="text-[10px] uppercase opacity-40 block mb-2">Título Principal</label>
            <input type="text" id="admin-title" class="w-full bg-[#1a1a1a] p-3 rounded mb-4 text-sm border border-white/5">
            <label class="text-[10px] uppercase opacity-40 block mb-2">Subtítulo</label>
            <input type="text" id="admin-subtitle" class="w-full bg-[#1a1a1a] p-3 rounded mb-4 text-sm border border-white/5">
            <label class="text-[10px] uppercase opacity-40 block mb-2">Créditos / Firma</label>
            <input type="text" id="admin-author" class="w-full bg-[#1a1a1a] p-3 rounded mb-4 text-sm border border-white/5">
            <label class="text-[10px] uppercase opacity-40 block mb-2">URL del Video de Fondo</label>
            <input type="text" id="admin-bg-url" class="w-full bg-[#1a1a1a] p-3 rounded mb-4 text-sm border border-white/5">
            
            <button onclick="updateAndSaveConfig()" class="w-full bg-orange-600 py-4 font-black uppercase text-xs rounded mt-6">Sincronizar Cambios</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        let currentConfig = {
            title: "INNERSPEAKER", 
            subtitle: "TAME IMPALA", 
            color1: "#c87c4a", 
            color2: "#4b6a4a", 
            bgUrl: "https://cdn.pixabay.com/video/2024/08/05/224962_large.mp4", 
            textAuthor: "DISEÑADO POR ANDRÉ D'LYNAE • UNA EXPERIENCIA PSICODÉLICA",
            textRoomHeader: "CONSTRUCCIÓN DEL ENTORNO", 
            textRoomInstruction: "ELIGE 3 ELEMENTOS QUE DEFINAN TU AHORA", 
            textVoiceHeader: "SINTONÍA DE CONCIENCIA", 
            textLoading: "PROCESANDO RESONANCIA ARMÓNICA...",
            songs: [
                { title: "It Is Not Meant To Be", desc: "La sensación de que algo está fuera de tu alcance.", critique: "Aceptación de lo imposible.", url: "https://youtu.be/3a7jLiSCtfU" },
                { title: "Alter Ego", desc: "La única persona que puede cambiarte eres tú mismo.", critique: "Conversación interna necesaria.", url: "https://youtu.be/VpLXxFhy7s4" },
                { title: "Solitude Is Bliss", desc: "Soledad por elección, la mayor libertad posible.", critique: "Independencia pura.", url: "https://youtu.be/N7eGu_p2jLk" },
                { title: "Lucidity", desc: "Momentos breves donde todo parece tener un sentido geométrico.", critique: "El despertar repentino.", url: "https://youtu.be/fM_LIsA3vH8" },
                { title: "Expectation", desc: "La brecha dolorosa entre la imagen mental y la realidad física.", critique: "Realismo psicodélico.", url: "https://youtu.be/i6Hm8SJF668" }
            ]
        };

        const OBJECT_MAP = {
            'Audífonos': ['Alter Ego', 'Solitude Is Bliss'], 'Espejo': ['Alter Ego', 'Expectation'], 'Ventana': ['Lucidity'],
            'Libreta': ['Expectation'], 'Silla': ['It Is Not Meant To Be'], 'Reloj': ['Expectation'],
            'Lámpara': ['Lucidity'], 'Vinilo': ['It Is Not Meant To Be'], 'Cama': ['Solitude Is Bliss']
        };

        let db, auth, user, selected = [];

        function setupFirebase() {
            try {
                const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
                if (!configStr) { applyConfig(); return; }
                const conf = JSON.parse(configStr);
                const app = initializeApp(conf);
                db = getFirestore(app);
                auth = getAuth(app);
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'innerspeaker-pro';

                onAuthStateChanged(auth, u => {
                    user = u;
                    if (u) {
                        onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'main'), snap => {
                            if (snap.exists()) { currentConfig = {...currentConfig, ...snap.data()}; applyConfig(); }
                        });
                    }
                });

                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                };
                initAuth();
            } catch (e) { applyConfig(); }
        }

        function applyConfig() {
            document.getElementById('editable-title').innerText = currentConfig.title;
            document.getElementById('editable-subtitle').innerText = currentConfig.subtitle;
            document.getElementById('status-text').innerText = currentConfig.textAuthor;
            document.getElementById('text-room-header').innerText = currentConfig.textRoomHeader;
            document.getElementById('room-instruction').innerText = currentConfig.textRoomInstruction;
            document.getElementById('text-voice-header').innerText = currentConfig.textVoiceHeader;
            document.getElementById('loading-msg').innerText = currentConfig.textLoading;

            const videoE = document.getElementById('bg-video');
            if (currentConfig.bgUrl) {
                videoE.src = currentConfig.bgUrl;
                videoE.oncanplay = () => videoE.style.opacity = "0.4";
            }
        }

        window.goTo = (id) => {
            const screens = document.querySelectorAll('.screen');
            screens.forEach(s => s.classList.remove('active'));
            setTimeout(() => {
                screens.forEach(s => s.style.display = 'none');
                const target = document.getElementById(`screen-${id}`);
                target.style.display = 'flex';
                setTimeout(() => target.classList.add('active'), 50);
            }, 600);
        };

        const grid = document.getElementById('objects-grid');
        Object.keys(OBJECT_MAP).forEach(obj => {
            const btn = document.createElement('button');
            btn.className = 'object-btn'; btn.innerText = obj;
            btn.onclick = () => {
                if (selected.includes(obj)) {
                    selected = selected.filter(x => x !== obj);
                    btn.classList.remove('selected');
                } else if (selected.length < 3) {
                    selected.push(obj);
                    btn.classList.add('selected');
                    if (selected.length === 3) setTimeout(() => goTo('voice'), 400);
                }
            };
            grid.appendChild(btn);
        });

        window.setVoice = (v) => {
            goTo('loading');
            setTimeout(() => {
                const song = currentConfig.songs[Math.floor(Math.random() * currentConfig.songs.length)];
                document.getElementById('res-title').innerText = song.title;
                document.getElementById('res-desc').innerText = song.desc;
                document.getElementById('res-critique').innerText = song.critique;
                document.getElementById('res-link').href = song.url;
                goTo('result');
            }, 2500);
        };

        window.openLogin = () => {
            const p = prompt("Acceso Administrador:");
            if (p === 'notasdazul') {
                document.getElementById('admin-panel').classList.add('open');
                document.getElementById('admin-title').value = currentConfig.title;
                document.getElementById('admin-subtitle').value = currentConfig.subtitle;
                document.getElementById('admin-author').value = currentConfig.textAuthor;
                document.getElementById('admin-bg-url').value = currentConfig.bgUrl;
            }
        };

        window.closeAdmin = () => document.getElementById('admin-panel').classList.remove('open');

        window.updateAndSaveConfig = async () => {
            if (!db || !user) return alert("Error de conexión");
            const data = {
                ...currentConfig,
                title: document.getElementById('admin-title').value,
                subtitle: document.getElementById('admin-subtitle').value,
                textAuthor: document.getElementById('admin-author').value,
                bgUrl: document.getElementById('admin-bg-url').value
            };
            await setDoc(doc(db, 'artifacts', typeof __app_id !== 'undefined' ? __app_id : 'innerspeaker-pro', 'public', 'data', 'config', 'main'), data);
            alert("Sincronizado");
            closeAdmin();
        };

        const tc = document.getElementById('trees-container');
        for(let i=0; i<8; i++) {
            const t = document.createElement('div'); t.className = 'tree';
            t.innerHTML = `<svg viewBox="0 0 100 100"><path d="M50 10 L85 90 L15 90 Z" fill="currentColor"/></svg>`;
            t.style.left = `${Math.random()*100}%`;
            t.style.top = `${Math.random()*100}%`;
            t.style.animation = `zoomTree ${15 + Math.random()*20}s infinite linear`;
            t.style.animationDelay = `${-Math.random()*20}s`;
            tc.appendChild(t);
        }

        setupFirebase();
    </script>
</body>
</html>
