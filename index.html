<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Innerspeaker Experience</title>
    
    <!-- Scripts Base -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        
        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background-color: #000; 
            color: white; 
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }
        
        .bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        .bg-image {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        .admin-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 0.6rem;
            border-radius: 0.4rem;
            width: 100%;
            font-size: 0.8rem;
            transition: border 0.2s;
        }
        .admin-input:focus { border-color: #fbbf24; outline: none; }

        .analysis-card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, collection } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCXcM54HHeambvpHkJY1-N1G3Q7UPcPOj8",
            authDomain: "innerspeaker-568f3.firebaseapp.com",
            projectId: "innerspeaker-568f3",
            storageBucket: "innerspeaker-568f3.firebasestorage.app",
            messagingSenderId: "945238998266",
            appId: "1:945238998266:web:661d0080b0d42cb7a59d43"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const rawAppId = typeof __app_id !== 'undefined' ? __app_id : 'innerspeaker-experience';
        const safeAppId = rawAppId.replace(/\./g, '_'); 
        
        const apiKeyGemini = ""; 
        const ADMIN_PASSWORD = "raiden";

        const DEFAULT_CONFIG = {
            appearance: {
                backgroundType: 'color', 
                backgroundUrl: '',
                bgColor: '#0b0f1a',
                textColor: '#f8fafc',
                accentColor: '#fbbf24',
                overlayOpacity: 0.5
            },
            texts: {
                welcomeTitle: "Innerspeaker",
                welcomeSubtitle: "Análisis sonoro basado en tu percepción",
                welcomeButton: "Iniciar análisis",
                selectionTitle: "Selecciona 3 objetos de tu entorno actual",
                voiceTitle: "¿Cómo percibes tu estado mental hoy?",
                voiceAmable: "En calma / Reflexivo",
                voiceCritica: "Inquieto / Analítico",
                revealTitle: "La frecuencia recomendada es:",
                youtubeButton: "Reproducir en YouTube",
                loadingText: "Analizando patrones musicales..."
            },
            objects: [
                { id: 1, name: "Cámara Analógica", song: "It Is Not Meant to Be", url: "https://www.youtube.com/watch?v=b0S6I0C2m-o", amablePct: 85 },
                { id: 2, name: "Prisma de Cristal", song: "Desire Be Desire Go", url: "https://www.youtube.com/watch?v=W-LpYtQY2pU", amablePct: 40 },
                { id: 3, name: "Hojas Secas", song: "Alter Ego", url: "https://www.youtube.com/watch?v=bBSropdYUtw", amablePct: 75 },
                { id: 4, name: "Cinta de Cassette", song: "Lucidity", url: "https://www.youtube.com/watch?v=AdBlnmD7Ios", amablePct: 60 },
                { id: 5, name: "Nube de Humo", song: "Why Won't You Make Up Your Mind?", url: "https://www.youtube.com/watch?v=mD9vUofHeYc", amablePct: 30 },
                { id: 6, name: "Espejo Roto", song: "Solitude Is Bliss", url: "https://www.youtube.com/watch?v=vxvf7gR4-2w", amablePct: 15 },
                { id: 7, name: "Arena Movediza", song: "Jeremy's Storm", url: "https://www.youtube.com/watch?v=0wL0M4tI0Lg", amablePct: 50 },
                { id: 8, name: "Luz de Neón", song: "Expectation", url: "https://www.youtube.com/watch?v=i9vVlO-H9nE", amablePct: 25 },
                { id: 9, name: "Ojo Infinito", song: "The Bold Arrow of Time", url: "https://www.youtube.com/watch?v=A2C6N8TndH8", amablePct: 10 },
                { id: 10, name: "Cúpula de Vidrio", song: "Runway, Houses, City, Clouds", url: "https://www.youtube.com/watch?v=NInW_u_rX_I", amablePct: 95 },
                { id: 11, name: "Eco de Montaña", song: "I Don't Really Mind", url: "https://www.youtube.com/watch?v=m9_Lid6hC54", amablePct: 65 }
            ]
        };

        async function callGemini(prompt, systemPrompt) {
            let retries = 0;
            const delay = (ms) => new Promise(res => setTimeout(res, ms));
            while (retries < 5) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKeyGemini}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });
                    const data = await response.json();
                    let text = data.candidates?.[0]?.content?.parts?.[0]?.text || "...";
                    return text.replace(/\*\*/g, '').replace(/\*/g, '');
                } catch (err) { retries++; await delay(Math.pow(2, retries) * 1000); }
            }
            return "Error al conectar con el analizador.";
        }

        const Icon = ({ name, size = 24, className = "" }) => {
            React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        function App() {
            const [user, setUser] = React.useState(null);
            const [screen, setScreen] = React.useState('home');
            const [config, setConfig] = React.useState(DEFAULT_CONFIG);
            const [selectedObjects, setSelectedObjects] = React.useState([]);
            const [voiceType, setVoiceType] = React.useState(null);
            const [isAdminMode, setIsAdminMode] = React.useState(false);
            const [adminPass, setAdminPass] = React.useState("");
            const [isAuthenticated, setIsAuthenticated] = React.useState(false);
            const [isAiLoading, setIsAiLoading] = React.useState(false);
            const [aiAnalysis, setAiAnalysis] = React.useState("");

            const getConfigDocRef = () => doc(db, 'artifacts', safeAppId, 'public', 'data', 'global', 'settings');

            React.useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token).catch(() => signInAnonymously(auth));
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) { console.error("Auth error:", err); }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            React.useEffect(() => {
                if (!user) return;
                const configDocRef = getConfigDocRef();
                const unsubscribe = onSnapshot(configDocRef, (snap) => {
                    if (snap.exists()) setConfig(snap.data());
                    else setDoc(configDocRef, DEFAULT_CONFIG).catch(console.error);
                }, (error) => console.error("Listen Error:", error));
                return () => unsubscribe();
            }, [user]);

            React.useEffect(() => {
                if (screen === 'loading-reveal') {
                    const timer = setTimeout(() => {
                        generateLyricAnalysis();
                        setScreen('reveal');
                    }, 2500);
                    return () => clearTimeout(timer);
                }
            }, [screen]);

            const generateLyricAnalysis = async () => {
                setIsAiLoading(true);
                const result = getResult();
                const systemPrompt = "Eres un analista musical técnico especializado en la psicodelia de Tame Impala. Tu tarea es explicar la relación entre los objetos, el estado mental y la canción recomendada. No menciones nombres de personas (no digas Kevin). No uses lenguaje poético. Sé directo y simple. PROHIBIDO usar negritas (**), cursivas o cualquier estilo de texto Markdown. Habla sobre frecuencias, texturas sonoras y atmósfera musical. No hagas comparaciones. Tu respuesta debe parecer natural, no generada por IA.";
                const prompt = `Estado mental: ${voiceType === 'amable' ? 'Calma' : 'Análisis crítico'}. Objetos seleccionados: ${selectedObjects.map(o=>o.name).join(', ')}. Canción recomendada: ${result.song}. Explica en 60 palabras por qué esta pista es el ajuste técnico ideal para este estado mental y estos objetos basándote en la música de Tame Impala.`;
                const response = await callGemini(prompt, systemPrompt);
                setAiAnalysis(response);
                setIsAiLoading(false);
            };

            const getResult = () => {
                const avg = selectedObjects.reduce((a, b) => a + b.amablePct, 0) / 3;
                const score = voiceType === 'amable' ? avg + 12 : avg - 12;
                return config.objects.reduce((prev, curr) => 
                    Math.abs(curr.amablePct - score) < Math.abs(prev.amablePct - score) ? curr : prev
                );
            };

            const handleUpdateConfig = async (e) => {
                if (e) e.preventDefault();
                if (!user) return;
                try {
                    await setDoc(getConfigDocRef(), config, { merge: true });
                    setIsAdminMode(false);
                } catch (err) { console.error("Update Error:", err); }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    setConfig({
                        ...config,
                        appearance: {
                            ...config.appearance,
                            backgroundUrl: event.target.result
                        }
                    });
                };
                reader.readAsDataURL(file);
            };

            const Background = () => {
                if (config.appearance.backgroundType === 'video' && config.appearance.backgroundUrl) {
                    return (
                        <video key={config.appearance.backgroundUrl} autoPlay muted loop playsInline className="bg-video">
                            <source src={config.appearance.backgroundUrl} type="video/mp4" />
                        </video>
                    );
                }
                if (config.appearance.backgroundType === 'image' && config.appearance.backgroundUrl) {
                    return <div className="bg-image" style={{ backgroundImage: `url(${config.appearance.backgroundUrl})` }} />;
                }
                return <div className="bg-image" style={{ backgroundColor: config.appearance.bgColor }} />;
            };

            const ScreenWrapper = ({ children, className = "" }) => (
                <div className="min-h-screen w-full flex flex-col items-center justify-center p-6 relative overflow-hidden" style={{ color: config.appearance.textColor }}>
                    <Background />
                    <div className="absolute inset-0 z-0 pointer-events-none" 
                         style={{ backgroundColor: config.appearance.backgroundType === 'color' ? 'transparent' : `rgba(0,0,0,${config.appearance.overlayOpacity})` }} />
                    <div className={`z-10 w-full max-w-4xl flex flex-col items-center animate-fade-in ${className}`}>
                        {children}
                    </div>
                    <button onClick={() => setIsAdminMode(true)} className="fixed bottom-4 right-4 p-2 opacity-5 hover:opacity-100 z-50 transition-opacity">
                        <Icon name="settings" size={14}/>
                    </button>
                </div>
            );

            if (isAdminMode) return (
                <div className="fixed inset-0 z-[100] bg-black/95 backdrop-blur-xl flex items-center justify-center p-4">
                    <div className="w-full max-w-2xl bg-[#0a0a0a] border border-white/10 rounded-2xl p-6 md:p-10 max-h-[90vh] overflow-y-auto custom-scrollbar">
                        {!isAuthenticated ? (
                            <div className="space-y-6 text-center">
                                <h2 className="text-xl font-black uppercase tracking-widest">Acceso Editor</h2>
                                <input type="password" placeholder="Contraseña" className="admin-input text-center" value={adminPass} 
                                    onChange={e => setAdminPass(e.target.value)} 
                                    onKeyDown={e => e.key === 'Enter' && adminPass === ADMIN_PASSWORD && setIsAuthenticated(true)}
                                />
                                <button onClick={() => adminPass === ADMIN_PASSWORD ? setIsAuthenticated(true) : setAdminPass("")} 
                                        className="w-full py-4 bg-white text-black font-black uppercase text-xs tracking-widest">Entrar</button>
                                <button onClick={() => setIsAdminMode(false)} className="text-[10px] uppercase font-bold opacity-30 mt-4">Cancelar</button>
                            </div>
                        ) : (
                            <div className="space-y-10 pb-10">
                                <div className="flex justify-between items-center sticky top-0 bg-[#0a0a0a] py-4 z-10 border-b border-white/10">
                                    <h2 className="text-xl font-black uppercase tracking-widest text-amber-500">Panel de Control</h2>
                                    <div className="flex gap-2">
                                        <button onClick={() => setIsAdminMode(false)} className="px-4 py-2 text-xs font-bold uppercase opacity-50">Cerrar</button>
                                        <button onClick={handleUpdateConfig} className="px-6 py-2 bg-amber-500 text-black font-bold text-xs uppercase tracking-widest rounded shadow-lg">Guardar</button>
                                    </div>
                                </div>
                                <section className="space-y-4">
                                    <h3 className="text-xs font-bold uppercase text-amber-500 tracking-widest">Fondo y Estética</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-[10px] uppercase opacity-40 font-bold">Tipo de Fondo</label>
                                            <select className="admin-input" value={config.appearance.backgroundType} onChange={e => setConfig({...config, appearance: {...config.appearance, backgroundType: e.target.value}})}>
                                                <option value="color">Color Sólido</option>
                                                <option value="image">Imagen (Enlace/Local)</option>
                                                <option value="video">Video (Enlace/Local MP4)</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[10px] uppercase opacity-40 font-bold">Opacidad Capa Negra</label>
                                            <input type="range" min="0" max="1" step="0.1" className="w-full mt-2" value={config.appearance.overlayOpacity} onChange={e => setConfig({...config, appearance: {...config.appearance, overlayOpacity: parseFloat(e.target.value)}})} />
                                        </div>
                                    </div>
                                    {config.appearance.backgroundType !== 'color' && (
                                        <div className="space-y-4">
                                            <div>
                                                <label className="text-[10px] uppercase opacity-40 font-bold">Enlace del Recurso (URL)</label>
                                                <input className="admin-input" placeholder="https://..." value={config.appearance.backgroundUrl} onChange={e => setConfig({...config, appearance: {...config.appearance, backgroundUrl: e.target.value}})} />
                                            </div>
                                            <div className="p-4 border border-dashed border-white/20 rounded-lg text-center">
                                                <label className="text-[10px] uppercase font-bold cursor-pointer block">
                                                    Subir desde dispositivo local
                                                    <input type="file" accept={config.appearance.backgroundType === 'video' ? 'video/mp4' : 'image/*'} className="hidden" onChange={handleFileUpload} />
                                                </label>
                                                <p className="text-[9px] opacity-40 mt-1">Soporta Imágenes y MP4</p>
                                            </div>
                                        </div>
                                    )}
                                    {config.appearance.backgroundType === 'color' && (
                                        <div>
                                            <label className="text-[10px] uppercase opacity-40 font-bold">Color de Fondo</label>
                                            <input type="color" className="admin-input h-10 p-1" value={config.appearance.bgColor} onChange={e => setConfig({...config, appearance: {...config.appearance, bgColor: e.target.value}})} />
                                        </div>
                                    )}
                                </section>
                                <section className="space-y-4">
                                    <h3 className="text-xs font-bold uppercase text-amber-500 tracking-widest">Textos de Pantalla</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {Object.keys(config.texts).map(key => (
                                            <div key={key}>
                                                <label className="text-[9px] uppercase opacity-40">{key}</label>
                                                <input className="admin-input" value={config.texts[key]} onChange={e => setConfig({...config, texts: {...config.texts, [key]: e.target.value}})} />
                                            </div>
                                        ))}
                                    </div>
                                </section>
                                <section className="space-y-4">
                                    <h3 className="text-xs font-bold uppercase text-amber-500 tracking-widest">Base de Canciones y Objetos</h3>
                                    <div className="grid grid-cols-1 gap-4">
                                        {config.objects.map((obj, idx) => (
                                            <div key={obj.id} className="p-4 bg-white/5 rounded-xl space-y-3 border border-white/5">
                                                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                                    <div>
                                                        <label className="text-[9px] uppercase opacity-40">Nombre Objeto</label>
                                                        <input className="admin-input" value={obj.name} onChange={e => {
                                                            const n = [...config.objects]; n[idx].name = e.target.value; setConfig({...config, objects: n});
                                                        }} />
                                                    </div>
                                                    <div>
                                                        <label className="text-[9px] uppercase opacity-40">Canción Tame Impala</label>
                                                        <input className="admin-input" value={obj.song} onChange={e => {
                                                            const n = [...config.objects]; n[idx].song = e.target.value; setConfig({...config, objects: n});
                                                        }} />
                                                    </div>
                                                    <div>
                                                        <label className="text-[9px] uppercase opacity-40">Enlace YouTube</label>
                                                        <input className="admin-input" value={obj.url} onChange={e => {
                                                            const n = [...config.objects]; n[idx].url = e.target.value; setConfig({...config, objects: n});
                                                        }} />
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            </div>
                        )}
                    </div>
                </div>
            );

            if (screen === 'home') return (
                <ScreenWrapper>
                    <h1 className="text-7xl md:text-9xl font-black uppercase tracking-tighter text-center leading-[0.85]">{config.texts.welcomeTitle}</h1>
                    <p className="text-[10px] md:text-xs tracking-[0.4em] font-bold opacity-60 uppercase py-10 text-center max-w-md">{config.texts.welcomeSubtitle}</p>
                    <button onClick={() => setScreen('selection')} className="px-14 py-6 bg-white text-black font-black text-xs uppercase tracking-widest hover:scale-110 transition-transform">
                        {config.texts.welcomeButton}
                    </button>
                </ScreenWrapper>
            );

            if (screen === 'selection') return (
                <ScreenWrapper>
                    <h2 className="text-[10px] font-bold mb-10 uppercase tracking-[0.4em] opacity-40">{config.texts.selectionTitle}</h2>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-10 w-full max-h-[55vh] overflow-y-auto custom-scrollbar px-4">
                        {config.objects.map(obj => {
                            const isSelected = selectedObjects.find(o => o.id === obj.id);
                            return (
                                <button key={obj.id} onClick={() => {
                                    if(isSelected) setSelectedObjects(selectedObjects.filter(o => o.id !== obj.id));
                                    else if(selectedObjects.length < 3) setSelectedObjects([...selectedObjects, obj]);
                                }} className={`aspect-square border-2 transition-all p-4 flex items-center justify-center text-center font-black uppercase text-[10px] tracking-tighter ${isSelected ? 'border-white bg-white text-black scale-95' : 'border-white/10 bg-black/40 hover:border-white/40'}`}>
                                    {obj.name}
                                </button>
                            );
                        })}
                    </div>
                    <button disabled={selectedObjects.length < 3} onClick={() => setScreen('voice')} 
                            className="px-16 py-5 border-2 border-white font-black uppercase text-[10px] tracking-widest disabled:opacity-10 hover:bg-white hover:text-black">
                        Continuar ({selectedObjects.length}/3)
                    </button>
                </ScreenWrapper>
            );

            if (screen === 'voice') return (
                <ScreenWrapper>
                    <h2 className="text-2xl md:text-4xl font-black uppercase tracking-widest mb-16 text-center leading-tight">{config.texts.voiceTitle}</h2>
                    <div className="flex flex-col gap-4 w-full max-w-sm">
                        <button onClick={() => { setVoiceType('amable'); setScreen('loading-reveal'); }} className="p-10 border-2 border-white/20 bg-black/40 hover:bg-white hover:text-black transition-all font-black uppercase text-xs tracking-[0.3em]">
                            {config.texts.voiceAmable}
                        </button>
                        <button onClick={() => { setVoiceType('critica'); setScreen('loading-reveal'); }} className="p-10 border-2 border-white/20 bg-black/40 hover:bg-white hover:text-black transition-all font-black uppercase text-xs tracking-[0.3em]">
                            {config.texts.voiceCritica}
                        </button>
                    </div>
                </ScreenWrapper>
            );

            if (screen === 'loading-reveal') return (
                <ScreenWrapper>
                    <div className="w-16 h-16 border-4 border-white/5 border-t-white rounded-full animate-spin mb-8" />
                    <p className="text-[10px] font-bold uppercase tracking-[0.5em] animate-pulse">{config.texts.loadingText}</p>
                </ScreenWrapper>
            );

            if (screen === 'reveal') {
                const res = getResult();
                return (
                    <ScreenWrapper>
                        <div className="text-center w-full space-y-12 max-w-3xl">
                            <div className="animate-fade-in">
                                <h3 className="text-[10px] font-bold uppercase tracking-[0.8em] opacity-30 mb-8">{config.texts.revealTitle}</h3>
                                <h2 className="text-6xl md:text-9xl font-black uppercase tracking-tighter leading-none border-y-2 border-white/10 py-12">{res.song}</h2>
                            </div>
                            <div className="analysis-card p-10 md:p-14 text-left animate-fade-in" style={{ animationDelay: '0.4s' }}>
                                {isAiLoading ? (
                                    <div className="space-y-4"><div className="h-2 bg-white/10 w-full rounded animate-pulse"/><div className="h-2 bg-white/10 w-5/6 rounded animate-pulse"/></div>
                                ) : (
                                    <p className="text-base md:text-lg font-normal leading-relaxed opacity-90 tracking-normal text-slate-100">
                                        {aiAnalysis}
                                    </p>
                                )}
                            </div>
                            <div className="flex flex-col md:flex-row gap-8 justify-center items-center animate-fade-in" style={{ animationDelay: '0.6s' }}>
                                <a href={res.url} target="_blank" rel="noopener noreferrer" className="w-full md:w-auto px-14 py-6 bg-white text-black font-black uppercase text-xs tracking-widest flex items-center justify-center gap-4 hover:scale-105 transition-transform">
                                    <Icon name="play" size={16} fill="currentColor" /> {config.texts.youtubeButton}
                                </a>
                                <button onClick={() => { setScreen('home'); setSelectedObjects([]); setVoiceType(null); setAiAnalysis(""); }} 
                                        className="text-[11px] uppercase font-black opacity-20 hover:opacity-100 tracking-widest">
                                    Explorar otra vez
                                </button>
                            </div>
                        </div>
                    </ScreenWrapper>
                );
            }
            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
