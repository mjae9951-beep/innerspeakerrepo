<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innerspeaker - Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #e2ddd1;
            --ink: #2a2a2a;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #1a1815;
            color: var(--ink);
            font-family: 'Special Elite', serif;
            overflow: hidden;
        }

        /* Textura de escaneo y ruido */
        .scanner-texture {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 3px, 2px 100%;
            pointer-events: none; z-index: 100; opacity: 0.5;
        }

        .paper-sheet {
            background-color: var(--paper);
            background-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');
            box-shadow: 20px 20px 60px rgba(0,0,0,0.7);
            padding: 40px;
            position: relative;
            max-width: 600px;
            width: 90%;
            min-height: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Borde roto psicodélico */
        .torn-edge {
            clip-path: polygon(1% 2%, 4% 0%, 9% 3%, 14% 1%, 19% 4%, 24% 1%, 31% 3%, 36% 0%, 41% 2%, 46% 1%, 51% 4%, 56% 1%, 62% 3%, 68% 1%, 74% 4%, 79% 1%, 84% 3%, 89% 1%, 94% 4%, 98% 1%, 100% 2%, 99% 98%, 94% 100%, 89% 97%, 84% 99%, 79% 96%, 74% 98%, 68% 95%, 62% 98%, 56% 96%, 51% 99%, 46% 96%, 41% 98%, 36% 96%, 31% 99%, 24% 97%, 19% 99%, 14% 96%, 9% 98%, 4% 96%, 0% 99%, 1% 97%);
        }

        .screen { display: none; opacity: 0; transition: opacity 0.5s ease; width: 100%; height: 100%; }
        .screen.active { display: flex; opacity: 1; }

        .object-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%;
        }

        .object-item {
            cursor: pointer; transition: all 0.3s; filter: grayscale(0.5);
            border: 2px solid transparent;
        }
        .object-item:hover { filter: grayscale(0); transform: translateY(-5px); }
        .object-item img { width: 100%; aspect-ratio: 1/1; object-fit: cover; box-shadow: 5px 5px 15px rgba(0,0,0,0.2); }
        .object-item.selected { filter: grayscale(0) sepia(0.4); border-color: var(--ink); transform: scale(0.95); }

        .btn-handwritten { font-family: 'Permanent Marker', cursive; }
        
        #status-bar { font-size: 10px; color: #777; margin-top: 15px; }
    </style>
</head>
<body class="flex items-center justify-center p-6">

    <div class="scanner-texture"></div>

    <div class="paper-sheet torn-edge" id="main-container">
        <!-- Pantalla 1: Inicio -->
        <div id="screen-landing" class="screen active flex-col items-center justify-center text-center">
            <div class="mb-6 rotate-[-3deg] border-[12px] border-white shadow-2xl w-48 h-48 overflow-hidden">
                <img src="https://images.unsplash.com/photo-1523730205978-59fd1b2965e3?auto=format&fit=crop&q=80&w=400" class="w-full h-full object-cover">
            </div>
            <h1 class="text-4xl font-black tracking-tighter uppercase mb-2">INNERSPEAKER</h1>
            <p class="text-[10px] opacity-50 tracking-[0.3em] mb-10">PROYECTO PSICODÉLICO CLOUD</p>
            <button onclick="goTo('room')" id="btn-start" class="btn-handwritten text-2xl border-b-2 border-black opacity-50 pointer-events-none">CARGANDO...</button>
            <p id="status-bar">Conectando con Firestore...</p>
        </div>

        <!-- Pantalla 2: Selección -->
        <div id="screen-room" class="screen flex-col items-center w-full">
            <h2 class="text-[10px] mb-8 uppercase font-bold tracking-widest text-zinc-500">Elige 3 fragmentos de tu entorno</h2>
            <div class="object-grid" id="grid"></div>
            <div id="counter" class="mt-8 text-xs font-bold uppercase border-t border-black/10 pt-4 w-full text-center">Seleccionados: 0/3</div>
        </div>

        <!-- Pantalla 3: Resultado -->
        <div id="screen-result" class="screen flex-col items-center justify-center text-center">
            <div class="border-l-4 border-black pl-4 text-left mb-8">
                <h3 id="res-title" class="text-3xl font-black uppercase italic"></h3>
                <p id="res-tagline" class="text-[9px] uppercase tracking-widest opacity-60"></p>
            </div>
            <p id="res-desc" class="text-xs leading-relaxed mb-10 italic"></p>
            <div class="flex justify-between w-full items-end">
                <a id="res-link" href="#" target="_blank" class="btn-handwritten text-2xl text-red-800 underline decoration-red-800/30">ESCUCHAR</a>
                <button onclick="location.reload()" class="text-[10px] uppercase font-bold border border-black px-3 py-1 hover:bg-black hover:text-white transition-all">Reiniciar</button>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCXcM54HHeambvpHkJY1-N1G3Q7UPcPOj8",
            authDomain: "innerspeaker-568f3.firebaseapp.com",
            projectId: "innerspeaker-568f3",
            storageBucket: "innerspeaker-568f3.firebasestorage.app",
            messagingSenderId: "945238998266",
            appId: "1:945238998266:web:661d0080b0d42cb7a59d43"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = 'innerspeaker-stackblitz-v1';

        let user = null;
        let selected = [];

        const objects = [
            { id: '1', name: "Espejo", url: "https://images.unsplash.com/photo-1595071534000-d8f95c057636?q=60&w=300" },
            { id: '2', name: "Ventana", url: "https://images.unsplash.com/photo-1508333706533-1ab43ecb1606?q=60&w=300" },
            { id: '3', name: "Libreta", url: "https://images.unsplash.com/photo-1517842645767-c639042777db?q=60&w=300" },
            { id: '4', name: "Cama", url: "https://images.unsplash.com/photo-1505691938895-1758d7eaa511?q=60&w=300" },
            { id: '5', name: "Reloj", url: "https://images.unsplash.com/photo-1509048191080-d2984bad6ad5?q=60&w=300" },
            { id: '6', name: "Lámpara", url: "https://images.unsplash.com/photo-1534073828943-f801091bb18c?q=60&w=300" }
        ];

        // 1. Iniciar Sesión (Anónima)
        signInAnonymously(auth).catch(e => {
            document.getElementById('status-bar').innerText = "Error: Activa 'Anónimo' en Firebase Console.";
            console.error(e);
        });

        onAuthStateChanged(auth, (u) => {
            if (u) {
                user = u;
                document.getElementById('status-bar').innerText = "Sincronizado con la nube.";
                const btn = document.getElementById('btn-start');
                btn.innerText = "ENTRAR";
                btn.classList.remove('opacity-50', 'pointer-events-none');
                loadProgress();
            }
        });

        // 2. Cargar datos de Firestore
        function loadProgress() {
            if (!user) return;
            const userDoc = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'progress');
            onSnapshot(userDoc, (snap) => {
                if (snap.exists()) {
                    selected = snap.data().selected || [];
                    updateUI();
                    if (selected.length === 3) {
                        setTimeout(() => showResult(), 600);
                    }
                }
            });
        }

        // 3. Guardar datos en Firestore
        async function toggleObject(name) {
            if (selected.includes(name)) {
                selected = selected.filter(n => n !== name);
            } else if (selected.length < 3) {
                selected.push(name);
            }
            
            const userDoc = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'progress');
            await setDoc(userDoc, { selected, timestamp: Date.now() });
        }

        function updateUI() {
            document.querySelectorAll('.object-item').forEach(el => {
                const name = el.getAttribute('data-name');
                el.classList.toggle('selected', selected.includes(name));
            });
            document.getElementById('counter').innerText = `Seleccionados: ${selected.length}/3`;
        }

        function showResult() {
            const library = [
                { title: "Solitude Is Bliss", tag: "Independencia pura", desc: "Has elegido los objetos que definen un espacio propio. Te sientes cómodo en el silencio de tu mente.", url: "https://youtu.be/N7eGu_p2jLk" },
                { title: "Alter Ego", tag: "Dualidad consciente", desc: "Tus elecciones muestran un equilibrio entre el adentro y el afuera. Estás listo para transformarte.", url: "https://youtu.be/VpLXxFhy7s4" },
                { title: "Expectation", tag: "Búsqueda infinita", desc: "Los fragmentos de tu realidad indican que estás esperando algo grande. La respuesta está en el camino.", url: "https://youtu.be/i6Hm8SXcFi8" }
            ];
            
            const res = library[selected.length % library.length];
            document.getElementById('res-title').innerText = res.title;
            document.getElementById('res-tagline').innerText = res.tag;
            document.getElementById('res-desc').innerText = res.desc;
            document.getElementById('res-link').href = res.url;
            goTo('result');
        }

        window.goTo = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${id}`).classList.add('active');
        };

        // Generar Grilla
        const grid = document.getElementById('grid');
        objects.forEach(obj => {
            const div = document.createElement('div');
            div.className = 'object-item';
            div.setAttribute('data-name', obj.name);
            div.innerHTML = `<img src="${obj.url}" alt="${obj.name}"><p class="text-[8px] mt-1 uppercase text-center font-bold">${obj.name}</p>`;
            div.onclick = () => toggleObject(obj.name);
            grid.appendChild(div);
        });
    </script>
</body>
</html>
