<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Innerspeaker - Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Permanent+Marker&family=Inter:wght@200;300;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0d1b1a; 
            --leaf-green: #4b6a4a;
            --autumn-orange: #c87c4a;
            --text-off: #e8e4d9;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-deep);
            color: var(--text-off);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .grain {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.15; pointer-events: none; z-index: 50;
        }

        .bg-layer {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 100%, var(--autumn-orange) -20%, var(--leaf-green) 40%, var(--bg-deep) 90%);
            z-index: -2; transition: opacity 1.5s ease; background-size: cover; background-position: center;
        }

        #bg-video, #bg-image {
            position: fixed; inset: 0; width: 100%; height: 100%;
            z-index: -3; object-fit: cover; opacity: 0; transition: opacity 2s ease;
        }

        #bg-video { z-index: -4; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        .tree {
            position: absolute; width: 80px; height: 80px;
            color: rgba(20, 40, 30, 0.4); transform-origin: center;
            pointer-events: none; z-index: -1;
        }

        @keyframes zoomTree {
            0% { transform: scale(0.1) rotate(0deg); opacity: 0; }
            15% { opacity: 0.6; }
            85% { opacity: 0.6; }
            100% { transform: scale(4) rotate(15deg); opacity: 0; }
        }

        .screen {
            display: none; position: absolute; inset: 0;
            flex-direction: column; align-items: center;
            justify-content: center; padding: 1.5rem;
            text-align: center; opacity: 0;
            transition: opacity 0.8s ease; z-index: 10;
        }

        .screen.active { display: flex; opacity: 1; }

        .object-btn {
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px); padding: 12px 8px;
            transition: all 0.2s ease; font-size: 0.7rem;
            letter-spacing: 0.1em; text-transform: uppercase; border-radius: 6px;
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
        }

        .object-btn.selected { background: var(--autumn-orange); color: white; border-color: var(--autumn-orange); transform: scale(0.95); }

        .voice-btn { font-family: 'Permanent Marker', cursive; font-size: 2.5rem; transition: color 0.3s, transform 0.3s; }

        @media (min-width: 640px) {
            .voice-btn { font-size: 4rem; }
            .object-btn { font-size: 0.85rem; padding: 1.5rem; }
        }

        .typewriter { font-family: 'Special Elite', serif; }

        .btn-main {
            border: 1px solid var(--text-off); padding: 1rem 2.5rem;
            text-transform: uppercase; font-weight: 900; letter-spacing: 0.3em;
            font-size: 0.8rem; transition: all 0.3s;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); cursor: pointer;
        }

        .btn-main:hover { background: var(--text-off); color: var(--bg-deep); }

        #secret-trigger { position: fixed; bottom: 0; right: 0; width: 50px; height: 50px; z-index: 9999; cursor: pointer; opacity: 0; }

        /* Admin Panel */
        #admin-panel {
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 550px; height: 100%;
            background: #0a0a0a; color: #eee; z-index: 10000; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; border-left: 1px solid #333;
        }
        #admin-panel.open { right: 0; }
        
        .admin-content { flex: 1; overflow-y: auto; padding: 2rem; }
        .admin-header { padding: 1.5rem 2rem; background: #151515; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .admin-input { background: #151515; border: 1px solid #333; color: white; width: 100%; padding: 0.8rem; margin-bottom: 0.8rem; font-size: 0.85rem; border-radius: 4px; outline: none; }
        .admin-input:focus { border-color: var(--autumn-orange); }
        .admin-section-title { font-size: 11px; font-weight: 900; letter-spacing: 0.2em; text-transform: uppercase; color: var(--autumn-orange); margin: 2rem 0 1rem 0; border-bottom: 1px solid #222; padding-bottom: 0.5rem; }

        .song-card { background: #151515; border: 1px solid #333; padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem; }
    </style>
</head>
<body>

    <div class="grain"></div>
    <video id="bg-video" autoplay muted loop playsinline></video>
    <img id="bg-image" alt="Background">
    <div class="bg-layer" id="dynamic-bg"></div>
    <div id="trees-container"></div>

    <div id="secret-trigger" onclick="openLogin()"></div>

    <!-- Pantalla de Inicio -->
    <div id="screen-landing" class="screen active">
        <h1 id="editable-title" class="text-6xl sm:text-9xl font-black tracking-tighter mb-4">INNERSPEAKER</h1>
        <h2 id="editable-subtitle" class="text-sm sm:text-2xl font-light tracking-[0.5em] mb-16 sm:mb-24 opacity-80 uppercase">TAME IMPALA</h2>
        <button onclick="goTo('room')" class="btn-main">EMPEZAR EXPERIENCIA</button>
        <p id="status-text" class="text-[9px] sm:text-[11px] mt-12 uppercase opacity-40 tracking-widest px-4 max-w-xs mx-auto leading-relaxed"></p>
    </div>

    <!-- Selección de Objetos -->
    <div id="screen-room" class="screen">
        <h2 id="text-room-header" class="text-[10px] font-black uppercase tracking-[0.4em] mb-8 opacity-50"></h2>
        <div class="grid grid-cols-3 gap-3 w-full max-w-sm aspect-square" id="objects-grid"></div>
        <p id="room-instruction" class="mt-10 text-[10px] opacity-40 uppercase tracking-widest"></p>
    </div>

    <!-- Selección de Voz -->
    <div id="screen-voice" class="screen">
        <h2 id="text-voice-header" class="text-[10px] font-black uppercase tracking-[0.4em] mb-16 opacity-50"></h2>
        <div class="flex flex-col gap-10">
            <button onclick="setVoice('kind')" id="text-voice-kind" class="voice-btn hover:text-orange-400">Amable</button>
            <div class="h-[1px] bg-white/10 w-32 mx-auto"></div>
            <button onclick="setVoice('critical')" id="text-voice-critical" class="voice-btn hover:text-orange-400">Crítica</button>
        </div>
    </div>

    <!-- Carga -->
    <div id="screen-loading" class="screen">
        <div class="w-12 h-12 border-2 border-white/10 border-t-orange-500 rounded-full animate-spin mb-8"></div>
        <p id="loading-msg" class="typewriter text-[10px] uppercase tracking-[0.4em] animate-pulse"></p>
    </div>

    <!-- Resultado Final -->
    <div id="screen-result" class="screen">
        <div class="max-w-lg w-full px-6 text-center sm:text-left">
            <p id="res-tag" class="text-[10px] font-bold text-orange-400 uppercase tracking-widest mb-4">Sintonía Encontrada</p>
            <h3 id="res-title" class="text-4xl sm:text-7xl font-black uppercase tracking-tighter mb-6"></h3>
            <div class="h-[1px] bg-white/20 w-full mb-8"></div>
            <p id="res-desc" class="typewriter text-sm sm:text-lg leading-relaxed mb-8 opacity-90"></p>
            <p id="res-critique" class="typewriter text-[11px] sm:text-[13px] italic opacity-50 mb-12 border-l-2 border-orange-500/30 pl-4"></p>
            <div class="flex flex-col sm:flex-row gap-6 items-center">
                <a id="res-link" href="#" target="_blank" class="btn-main w-full sm:w-auto text-center">ESCUCHAR EN YOUTUBE</a>
                <button onclick="location.reload()" class="text-[9px] uppercase font-black opacity-30 hover:opacity-100 tracking-[0.3em]">Reiniciar Viaje</button>
            </div>
        </div>
    </div>

    <!-- Panel de Administración -->
    <div id="admin-panel">
        <div class="admin-header">
            <h2 class="font-black text-orange-500 text-xl uppercase tracking-tighter">Editor de Experiencia</h2>
            <button onclick="closeAdmin()" class="text-[10px] bg-white/10 px-4 py-2 rounded hover:bg-white/20 uppercase font-bold">Cerrar</button>
        </div>
        <div class="admin-content">
            <div class="admin-section-title">Identidad Visual</div>
            <label class="text-[9px] opacity-40 uppercase mb-1 block">Título Principal</label>
            <input type="text" id="admin-title" class="admin-input">
            <label class="text-[9px] opacity-40 uppercase mb-1 block">Subtítulo</label>
            <input type="text" id="admin-subtitle" class="admin-input">
            <label class="text-[9px] opacity-40 uppercase mb-1 block">Firma/Créditos</label>
            <input type="text" id="admin-author" class="admin-input">
            
            <div class="admin-section-title">Colores de Degradado</div>
            <div class="grid grid-cols-2 gap-4">
                <input type="color" id="admin-c1" class="admin-input h-12 p-1">
                <input type="color" id="admin-c2" class="admin-input h-12 p-1">
            </div>

            <div class="admin-section-title">Multimedia de Fondo</div>
            <label class="text-[9px] opacity-40 uppercase mb-1 block">URL (Imagen o Video MP4 Directo)</label>
            <input type="text" id="admin-bg-url" class="admin-input" placeholder="https://ejemplo.com/video.mp4">

            <div class="admin-section-title">Textos de Interfaz</div>
            <input type="text" id="admin-txt-room" placeholder="Cabecera Objetos" class="admin-input">
            <input type="text" id="admin-txt-inst" placeholder="Instrucción Objetos" class="admin-input">
            <input type="text" id="admin-txt-voice" placeholder="Cabecera Voz" class="admin-input">
            <input type="text" id="admin-txt-load" placeholder="Mensaje Carga" class="admin-input">

            <div class="admin-section-title">Base de Datos de Canciones</div>
            <div id="songs-editor-list"></div>
        </div>
        <div class="admin-footer p-6 border-t border-white/10">
            <button onclick="updateAndSaveConfig()" class="w-full bg-orange-600 hover:bg-orange-500 py-4 text-[12px] font-black uppercase rounded shadow-2xl transition">Guardar Cambios en la Nube</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'innerspeaker-pro';

        let currentConfig = {
            title: "INNERSPEAKER", 
            subtitle: "TAME IMPALA", 
            color1: "#c87c4a", 
            color2: "#4b6a4a", 
            bgUrl: "", 
            textAuthor: "DISEÑADO POR ANDRÉ D'LYNAE • UNA EXPERIENCIA PSICODÉLICA",
            textRoomHeader: "CONSTRUCCIÓN DEL ENTORNO", 
            textRoomInstruction: "ELIGE 3 ELEMENTOS QUE DEFINAN TU AHORA", 
            textVoiceHeader: "SINTONÍA DE CONCIENCIA", 
            textLoading: "PROCESANDO RESONANCIA ARMÓNICA...",
            songs: [
                { title: "It Is Not Meant To Be", desc: "La sensación de que algo está fuera de tu alcance.", critique: "Aceptación de lo imposible.", url: "https://youtu.be/3a7jLiSCtfU" },
                { title: "Desire Be Desire Go", desc: "El deseo es una fuerza que fluye y se desvanece.", critique: "Fuga cerebral constante.", url: "https://youtu.be/L_u7IPrN2-8" },
                { title: "Alter Ego", desc: "La única persona que puede cambiarte eres tú mismo.", critique: "Conversación interna necesaria.", url: "https://youtu.be/VpLXxFhy7s4" },
                { title: "Lucidity", desc: "Momentos breves donde todo parece tener un sentido geométrico.", critique: "El despertar repentino.", url: "https://youtu.be/fM_LIsA3vH8" },
                { title: "Why Won’t You Make Up Your Mind?", desc: "Parálisis por análisis en un bucle infinito.", critique: "Duda existencial rítmica.", url: "https://youtu.be/CwIV58Fk6GQ" },
                { title: "Solitude Is Bliss", desc: "Soledad por elección, la mayor libertad posible.", critique: "Independencia pura.", url: "https://youtu.be/N7eGu_p2jLk" },
                { title: "Jeremy's Storm", desc: "Una tormenta interna que limpia el ruido innecesario.", critique: "Limpieza sónica profunda.", url: "https://youtu.be/kU_pLgPscvA" },
                { title: "Expectation", desc: "La brecha dolorosa entre la imagen mental y la realidad física.", critique: "Realismo psicodélico.", url: "https://youtu.be/i6Hm8SJF668" },
                { title: "The Bold Arrow Of Time", desc: "El tiempo como una flecha pesada que avanza sin mirar atrás.", critique: "Anacronismo deliberado.", url: "https://youtu.be/S4pI6v_YQwI" },
                { title: "Runway, Houses, City, Clouds", desc: "Mirar el mundo desde una perspectiva aérea y distante.", critique: "Viaje astral contemplativo.", url: "https://youtu.be/t_uI-H09_f0" },
                { title: "I Don't Really Mind", desc: "Al final del día, nada importa tanto como la calma interior.", critique: "Cierre de ciclo.", url: "https://youtu.be/q09R69Yf0Hk" }
            ]
        };

        const OBJECT_MAP = {
            'Audífonos': ['Alter Ego', 'Solitude Is Bliss'], 'Espejo': ['Alter Ego', 'Expectation'], 'Ventana': ['Runway, Houses, City, Clouds', 'Lucidity'],
            'Libreta': ['Why Won’t You Make Up Your Mind?', 'Expectation'], 'Silla': ['Jeremy\'s Storm', 'I Don\'t Really Mind'], 'Reloj': ['The Bold Arrow Of Time', 'Why Won’t You Make Up Your Mind?'],
            'Lámpara': ['Lucidity', 'Desire Be Desire Go'], 'Vinilo': ['It Is Not Meant To Be', 'The Bold Arrow Of Time'], 'Cama': ['It Is Not Meant To Be', 'Desire Be Desire Go']
        };

        const TONAL_FAMILIES = {
            kind: ['Solitude Is Bliss', 'Lucidity', 'Runway, Houses, City, Clouds', 'I Don\'t Really Mind', 'Desire Be Desire Go'],
            critical: ['Alter Ego', 'Expectation', 'Why Won’t You Make Up Your Mind?', 'It Is Not Meant To Be', 'Jeremy\'s Storm', 'The Bold Arrow Of Time']
        };

        let user = null;
        let selected = [];
        let innerVoice = null;

        function applyConfig() {
            document.getElementById('editable-title').innerText = currentConfig.title;
            document.getElementById('editable-subtitle').innerText = currentConfig.subtitle;
            document.getElementById('status-text').innerText = currentConfig.textAuthor;
            document.getElementById('text-room-header').innerText = currentConfig.textRoomHeader;
            document.getElementById('room-instruction').innerText = currentConfig.textRoomInstruction;
            document.getElementById('text-voice-header').innerText = currentConfig.textVoiceHeader;
            document.getElementById('loading-msg').innerText = currentConfig.textLoading;

            const bgL = document.getElementById('dynamic-bg');
            const videoE = document.getElementById('bg-video');
            const imageE = document.getElementById('bg-image');

            videoE.style.opacity = "0";
            imageE.style.opacity = "0";
            bgL.style.opacity = "1";

            if (currentConfig.bgUrl) {
                const isV = currentConfig.bgUrl.match(/\.(mp4|webm|ogg)/i) || currentConfig.bgUrl.includes('pixabay.com/videos');
                if (isV) { 
                    videoE.src = currentConfig.bgUrl; 
                    videoE.oncanplay = () => { videoE.style.opacity = "1"; bgL.style.opacity = "0.3"; };
                    videoE.onerror = () => { imageE.style.opacity = "0.5"; bgL.style.opacity = "1"; };
                } else { 
                    imageE.src = currentConfig.bgUrl; 
                    imageE.onload = () => { imageE.style.opacity = "1"; bgL.style.opacity = "0.3"; };
                }
            } else {
                bgL.style.background = `radial-gradient(circle at 50% 100%, ${currentConfig.color1} -20%, ${currentConfig.color2} 40%, var(--bg-deep) 90%)`;
            }
        }

        // Sistema de Autenticación con Reintentos
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth error, retrying...", err);
                setTimeout(initAuth, 2000);
            }
        };

        onAuthStateChanged(auth, u => {
            user = u;
            if (u) {
                onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'main'), (snap) => {
                    if (snap.exists()) { 
                        currentConfig = { ...currentConfig, ...snap.data() }; 
                        applyConfig(); 
                    }
                }, (err) => console.log("Snap error:", err));
            }
        });

        initAuth();

        // UI Builder
        const grid = document.getElementById('objects-grid');
        Object.keys(OBJECT_MAP).forEach(obj => {
            const btn = document.createElement('button');
            btn.className = 'object-btn'; btn.innerText = obj;
            btn.onclick = () => {
                if (selected.includes(obj)) { selected = selected.filter(n => n !== obj); btn.classList.remove('selected'); }
                else if (selected.length < 3) { selected.push(obj); btn.classList.add('selected'); }
                if (selected.length === 3) setTimeout(() => goTo('voice'), 500);
            };
            grid.appendChild(btn);
        });

        window.setVoice = (v) => {
            innerVoice = v; goTo('loading');
            setTimeout(() => {
                const pool = OBJECT_MAP[selected[0]];
                let title = pool[Math.floor(Math.random() * pool.length)];
                if (!TONAL_FAMILIES[innerVoice].includes(title)) {
                    const filteredFamily = TONAL_FAMILIES[innerVoice];
                    title = filteredFamily[Math.floor(Math.random() * filteredFamily.length)];
                }
                const track = currentConfig.songs.find(s => s.title === title) || currentConfig.songs[0];
                document.getElementById('res-title').innerText = track.title;
                document.getElementById('res-desc').innerText = track.desc;
                document.getElementById('res-critique').innerText = track.critique;
                document.getElementById('res-link').href = track.url;
                goTo('result');
            }, 3000);
        };

        window.goTo = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            setTimeout(() => {
                document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
                const n = document.getElementById(`screen-${id}`);
                n.style.display = 'flex'; 
                setTimeout(() => n.classList.add('active'), 50);
            }, 600);
        };

        window.openLogin = () => {
            const u = prompt("Usuario:"); 
            const p = prompt("Contraseña:");
            if (u === 'asaehvi' && p === 'notasdazul') {
                document.getElementById('admin-panel').classList.add('open');
                document.getElementById('admin-title').value = currentConfig.title;
                document.getElementById('admin-subtitle').value = currentConfig.subtitle;
                document.getElementById('admin-author').value = currentConfig.textAuthor;
                document.getElementById('admin-c1').value = currentConfig.color1;
                document.getElementById('admin-c2').value = currentConfig.color2;
                document.getElementById('admin-bg-url').value = currentConfig.bgUrl;
                document.getElementById('admin-txt-room').value = currentConfig.textRoomHeader;
                document.getElementById('admin-txt-inst').value = currentConfig.textRoomInstruction;
                document.getElementById('admin-txt-voice').value = currentConfig.textVoiceHeader;
                document.getElementById('admin-txt-load').value = currentConfig.textLoading;
                
                const list = document.getElementById('songs-editor-list'); list.innerHTML = "";
                currentConfig.songs.forEach((s, i) => {
                    const d = document.createElement('div'); d.className = "song-card";
                    d.innerHTML = `
                        <p class="text-[10px] font-black text-orange-400 mb-3">#${i+1} TRACK CONFIG</p>
                        <input type="text" value="${s.title}" onchange="currentConfig.songs[${i}].title=this.value" class="admin-input" placeholder="Título">
                        <input type="text" value="${s.url}" onchange="currentConfig.songs[${i}].url=this.value" class="admin-input" placeholder="URL YouTube">
                        <textarea onchange="currentConfig.songs[${i}].desc=this.value" class="admin-input h-20" placeholder="Descripción">${s.desc}</textarea>
                        <input type="text" value="${s.critique}" onchange="currentConfig.songs[${i}].critique=this.value" class="admin-input" placeholder="Crítica">
                    `;
                    list.appendChild(d);
                });
            }
        };

        window.closeAdmin = () => document.getElementById('admin-panel').classList.remove('open');

        window.updateAndSaveConfig = async () => {
            if (!user) return alert("Firebase no autenticado.");
            const data = {
                ...currentConfig,
                title: document.getElementById('admin-title').value,
                subtitle: document.getElementById('admin-subtitle').value,
                textAuthor: document.getElementById('admin-author').value,
                color1: document.getElementById('admin-c1').value,
                color2: document.getElementById('admin-c2').value,
                bgUrl: document.getElementById('admin-bg-url').value,
                textRoomHeader: document.getElementById('admin-txt-room').value,
                textRoomInstruction: document.getElementById('admin-txt-inst').value,
                textVoiceHeader: document.getElementById('admin-txt-voice').value,
                textLoading: document.getElementById('admin-txt-load').value
            };
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'main'), data);
                alert("Configuración sincronizada con éxito."); 
                closeAdmin();
            } catch(e) { alert("Error al guardar: " + e.message); }
        };

        // Efecto Visual de Fondo
        const tc = document.getElementById('trees-container');
        for(let i=0; i<10; i++) {
            const t = document.createElement('div'); t.className = 'tree';
            t.innerHTML = `<svg viewBox="0 0 100 100"><path d="M50 5 L90 90 L10 90 Z" fill="currentColor"/></svg>`;
            t.style.left = `${Math.random()*100}%`; t.style.top = `${Math.random()*90}%`;
            t.style.animation = `zoomTree ${15+Math.random()*25}s linear infinite`;
            tc.appendChild(t);
        }
    </script>
</body>
</html>
