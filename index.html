<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Innerspeaker Experience</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background-color: #000; 
            color: white; 
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
        }

        .bg-gradient-psych {
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            position: fixed;
            inset: 0;
            z-index: -1;
        }

        .objects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 500px;
        }

        .object-btn {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            text-transform: uppercase;
            font-weight: 900;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.2s ease;
            border-radius: 12px;
            padding: 8px;
            font-size: 10px;
            line-height: 1.1;
        }

        .object-btn.active {
            background: white;
            color: black;
            border-color: white;
            transform: scale(0.95);
        }

        .voice-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            transition: transform 0.2s ease;
        }
        
        .voice-card:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.1);
        }

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-soft { animation: pulse-soft 2s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const ALBUM_DATA = {
            objects: [
                { id: 1, name: "Cámara", song: "It Is Not Meant to Be", weight: 90 },
                { id: 2, name: "Prisma", song: "Desire Be Desire Go", weight: 80 },
                { id: 3, name: "Hojas", song: "Alter Ego", weight: 70 },
                { id: 4, name: "Cassette", song: "Lucidity", weight: 60 },
                { id: 5, name: "Humo", song: "Why Won't You Make Up Your Mind?", weight: 50 },
                { id: 6, name: "Espejo", song: "Solitude Is Bliss", weight: 40 },
                { id: 7, name: "Arena", song: "Jeremy's Storm", weight: 30 },
                { id: 8, name: "Neón", song: "Expectation", weight: 25 },
                { id: 9, name: "Ojo", song: "The Bold Arrow of Time", weight: 15 },
                { id: 10, name: "Reloj", song: "Runway, Houses, City, Clouds", weight: 10 },
                { id: 11, name: "Cielo", song: "I Don't Really Mind", weight: 5 }
            ]
        };

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        function App() {
            const [screen, setScreen] = useState('home');
            const [selected, setSelected] = useState([]);
            const [voiceType, setVoiceType] = useState(null);

            const getResult = () => {
                const voiceModifier = voiceType === 'amable' ? 12 : -12;
                const avg = (selected.reduce((a, b) => a + b.weight, 0) / 3) + voiceModifier;
                return ALBUM_DATA.objects.reduce((p, c) => 
                    Math.abs(c.weight - avg) < Math.abs(p.weight - avg) ? c : p
                );
            };

            const Screen = ({ children }) => (
                <div className="min-h-screen w-full flex flex-col items-center justify-center p-6 text-center animate-in fade-in duration-500">
                    <div className="bg-gradient-psych" />
                    <div className="w-full max-w-md z-10 flex flex-col items-center">
                        {children}
                    </div>
                </div>
            );

            if (screen === 'home') return (
                <Screen>
                    <h1 className="text-6xl font-black uppercase italic tracking-tighter mb-2 leading-none">Innerspeaker</h1>
                    <p className="text-[10px] uppercase tracking-[0.4em] font-bold opacity-40 mb-12">Experiencia Sonora</p>
                    <button 
                        onClick={() => setScreen('select')}
                        className="bg-white text-black font-black uppercase text-xs px-12 py-5 rounded-full"
                    >
                        Comenzar
                    </button>
                </Screen>
            );

            if (screen === 'select') return (
                <Screen>
                    <h2 className="text-[10px] font-black uppercase tracking-[0.2em] opacity-50 mb-8">Selecciona 3 elementos de tu entorno</h2>
                    <div className="objects-grid mb-10">
                        {ALBUM_DATA.objects.map(obj => {
                            const isActive = selected.some(s => s.id === obj.id);
                            return (
                                <button 
                                    key={obj.id}
                                    disabled={selected.length >= 3 && !isActive}
                                    onClick={() => {
                                        if (isActive) setSelected(selected.filter(s => s.id !== obj.id));
                                        else if (selected.length < 3) {
                                            const newList = [...selected, obj];
                                            setSelected(newList);
                                            if (newList.length === 3) setTimeout(() => setScreen('voice'), 500);
                                        }
                                    }}
                                    className={`object-btn ${isActive ? 'active' : 'bg-white/5 opacity-60'}`}
                                >
                                    {obj.name}
                                </button>
                            );
                        })}
                    </div>
                    <p className="text-[9px] uppercase font-bold opacity-30 tracking-widest">
                        {selected.length} de 3 seleccionados
                    </p>
                </Screen>
            );

            if (screen === 'voice') return (
                <Screen>
                    <h2 className="text-3xl font-black italic uppercase tracking-tighter mb-10 leading-tight px-4">
                        ¿Cómo suena tu voz interior hoy?
                    </h2>
                    <div className="flex flex-col gap-4 w-full">
                        <button 
                            onClick={() => { setVoiceType('amable'); setScreen('loading'); }}
                            className="voice-card flex items-center justify-between"
                        >
                            <span className="font-black uppercase italic text-lg">Amable y Compasiva</span>
                            <Icon name="heart" size={20} className="text-white opacity-40" />
                        </button>
                        <button 
                            onClick={() => { setVoiceType('critica'); setScreen('loading'); }}
                            className="voice-card flex items-center justify-between"
                        >
                            <span className="font-black uppercase italic text-lg">Crítica y Analítica</span>
                            <Icon name="zap" size={20} className="text-white opacity-40" />
                        </button>
                    </div>
                </Screen>
            );

            if (screen === 'loading') {
                setTimeout(() => setScreen('reveal'), 2000);
                return (
                    <Screen>
                        <div className="w-12 h-12 border-2 border-white/20 border-t-white rounded-full animate-spin mb-6" />
                        <p className="text-[10px] uppercase font-bold tracking-[0.3em] animate-pulse-soft">Sintonizando frecuencia...</p>
                    </Screen>
                );
            }

            if (screen === 'reveal') {
                const result = getResult();
                return (
                    <Screen>
                        <p className="text-[10px] font-black uppercase tracking-[0.5em] opacity-40 mb-4">Tu Frecuencia:</p>
                        <h2 className="text-5xl font-black uppercase italic tracking-tighter leading-none mb-16 px-2">
                            {result.song}
                        </h2>
                        <button 
                            onClick={() => { setScreen('home'); setSelected([]); setVoiceType(null); }}
                            className="text-[10px] font-black uppercase opacity-30 tracking-widest border-b border-white/20 pb-1"
                        >
                            Reiniciar
                        </button>
                    </Screen>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
