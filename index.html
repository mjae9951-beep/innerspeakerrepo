<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Innerspeaker - Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Permanent+Marker&family=Inter:wght@200;300;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0d1b1a; 
            --leaf-green: #4b6a4a;
            --autumn-orange: #c87c4a;
            --text-off: #e8e4d9;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-deep);
            color: var(--text-off);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .grain {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.15; pointer-events: none; z-index: 50;
        }

        .bg-layer {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 100%, var(--autumn-orange) -20%, var(--leaf-green) 40%, var(--bg-deep) 90%);
            z-index: -2;
            transition: opacity 1.5s ease;
            background-size: cover;
            background-position: center;
        }

        #bg-video {
            position: fixed; top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            z-index: -3; transform: translateX(-50%) translateY(-50%);
            object-fit: cover; opacity: 0; transition: opacity 2s ease;
        }

        .tree {
            position: absolute; width: 120px; height: 120px;
            color: rgba(20, 40, 30, 0.4); transform-origin: center;
            pointer-events: none; z-index: -1;
        }

        @keyframes zoomTree {
            0% { transform: scale(0.1) rotate(0deg); opacity: 0; }
            15% { opacity: 0.6; }
            85% { opacity: 0.6; }
            100% { transform: scale(4) rotate(15deg); opacity: 0; }
        }

        .screen {
            display: none; position: absolute; inset: 0;
            flex-direction: column; align-items: center;
            justify-content: center; padding: 1.5rem;
            text-align: center; opacity: 0;
            transition: opacity 0.6s ease; z-index: 10;
        }

        .screen.active { display: flex; opacity: 1; }

        .object-btn {
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px); padding: 0.8rem 0.5rem;
            transition: all 0.2s ease; font-size: 0.65rem;
            letter-spacing: 0.1em; text-transform: uppercase; border-radius: 4px;
        }

        .object-btn.selected {
            background: var(--autumn-orange); color: white;
            border-color: var(--autumn-orange); transform: scale(0.95);
        }

        .voice-btn {
            font-family: 'Permanent Marker', cursive; font-size: 2.2rem;
            transition: color 0.3s, transform 0.3s;
        }

        @media (min-width: 640px) {
            .voice-btn { font-size: 3.5rem; }
            .object-btn { font-size: 0.8rem; padding: 1.25rem; }
        }

        .typewriter { font-family: 'Special Elite', serif; }

        .btn-main {
            border: 1px solid var(--text-off); padding: 1rem 2.5rem;
            text-transform: uppercase; font-weight: 900; letter-spacing: 0.25em;
            font-size: 0.8rem; transition: all 0.3s;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(4px);
        }

        .btn-main:hover { background: var(--text-off); color: var(--bg-deep); }

        #secret-trigger {
            position: fixed; top: 0; right: 0; width: 60px; height: 60px;
            z-index: 9999; cursor: pointer; background: transparent;
        }

        #admin-panel {
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 480px; height: 100%;
            background: #0d0d0d; color: #eee; z-index: 10000; transition: 0.4s ease;
            padding: 2rem; overflow-y: auto; border-left: 1px solid #333;
        }
        #admin-panel.open { right: 0; }
        
        .admin-input {
            background: #1a1a1a; border: 1px solid #333; color: white;
            width: 100%; padding: 0.8rem; margin-bottom: 1.2rem; font-size: 0.85rem;
            border-radius: 6px; outline: none;
        }

        .song-editor-card {
            background: rgba(255,255,255,0.03); border: 1px solid #333;
            padding: 1.5rem; margin-bottom: 1.5rem; border-radius: 12px;
        }
        
        label { font-size: 0.65rem; text-transform: uppercase; opacity: 0.5; font-weight: 900; letter-spacing: 0.15em; margin-bottom: 0.5rem; display: block; color: var(--autumn-orange); }

        #admin-panel::-webkit-scrollbar { width: 5px; }
        #admin-panel::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="grain"></div>
    <video id="bg-video" autoplay muted loop playsinline></video>
    <div class="bg-layer" id="dynamic-bg"></div>
    <div id="trees-container"></div>

    <div id="secret-trigger" onclick="openLogin()"></div>

    <!-- PANTALLA 1: LANDING -->
    <div id="screen-landing" class="screen active">
        <h1 id="editable-title" class="text-6xl sm:text-8xl font-black tracking-tighter mb-2">INNERSPEAKER</h1>
        <h2 id="editable-subtitle" class="text-lg sm:text-2xl font-light tracking-[0.4em] mb-12 sm:mb-20 opacity-80 uppercase">TAME IMPALA</h2>
        <button onclick="goTo('room')" id="btn-start" class="btn-main">ACCEDER</button>
        <p id="status-text" class="text-[9px] sm:text-[10px] mt-8 uppercase opacity-60 tracking-widest px-4 max-w-xs leading-relaxed">Producido por André d'Lynae</p>
    </div>

    <!-- PANTALLA 2: ROOM -->
    <div id="screen-room" class="screen">
        <h2 class="text-[10px] font-black uppercase tracking-[0.4em] mb-8 opacity-40">Percepción del entorno</h2>
        <div class="grid grid-cols-3 gap-2 sm:gap-4 w-full max-w-sm" id="objects-grid"></div>
        <p id="room-instruction" class="mt-10 text-[10px] opacity-40 uppercase tracking-widest">Selecciona 3 fragmentos de tu realidad</p>
    </div>

    <!-- PANTALLA 3: VOICE -->
    <div id="screen-voice" class="screen">
        <h2 class="text-[10px] font-black uppercase tracking-[0.4em] mb-16 opacity-40">La Voz Interior</h2>
        <div class="flex flex-col gap-8">
            <button onclick="setVoice('kind')" class="voice-btn">Amable</button>
            <div class="h-[1px] bg-white/10 w-32 mx-auto"></div>
            <button onclick="setVoice('critical')" class="voice-btn">Crítica</button>
        </div>
    </div>

    <!-- PANTALLA 4: LOADING -->
    <div id="screen-loading" class="screen">
        <div class="w-12 h-12 border-2 border-white/10 border-t-white rounded-full animate-spin mb-8"></div>
        <p id="loading-msg" class="typewriter text-[10px] uppercase tracking-[0.3em] animate-pulse">Buscando resonancia armónica...</p>
    </div>

    <!-- PANTALLA 5: RESULT -->
    <div id="screen-result" class="screen">
        <div class="max-w-md px-6">
            <h3 id="res-title" class="text-4xl sm:text-6xl font-black uppercase tracking-tighter mb-4"></h3>
            <p id="res-tag" class="text-[10px] font-bold text-orange-400 uppercase tracking-widest mb-6 opacity-80">Vibración Resonante</p>
            <div class="h-[1px] bg-white/10 w-full mb-8"></div>
            <p id="res-desc" class="typewriter text-sm sm:text-base leading-relaxed mb-8"></p>
            <p id="res-critique" class="typewriter text-[11px] sm:text-[12px] italic opacity-50 mb-12"></p>
            
            <div class="flex flex-col gap-6 items-center">
                <a id="res-link" href="#" target="_blank" class="btn-main w-full sm:w-auto">Escuchar Track</a>
                <button id="res-reset-btn" onclick="location.reload()" class="text-[9px] uppercase font-black opacity-30 hover:opacity-100 tracking-[0.3em] transition-opacity">Reiniciar Conciencia</button>
            </div>
        </div>
    </div>

    <!-- PANEL DE ADMIN -->
    <div id="admin-panel">
        <div class="flex justify-between items-center mb-10">
            <h2 class="font-black text-orange-500 tracking-tighter text-3xl">EDITOR CORE</h2>
            <button onclick="closeAdmin()" class="text-xs opacity-50 uppercase font-bold tracking-widest">Cerrar</button>
        </div>
        
        <div class="mb-12">
            <h3 class="text-[11px] font-black mb-6 uppercase text-orange-300 border-b border-orange-300/20 pb-2">Estética del Sistema</h3>
            <label>Título del Álbum</label>
            <input type="text" id="admin-title" class="admin-input">
            <label>Artista / Subtítulo</label>
            <input type="text" id="admin-subtitle" class="admin-input">
            <div class="grid grid-cols-2 gap-4">
                <div><label>Color Aura</label><input type="color" id="admin-c1" class="admin-input h-12"></div>
                <div><label>Color Mente</label><input type="color" id="admin-c2" class="admin-input h-12"></div>
            </div>
            <label>URL Video Fondo</label><input type="text" id="admin-video" class="admin-input">
            <label>URL Imagen Fondo</label><input type="text" id="admin-bg-img" class="admin-input">
        </div>

        <div class="mb-12">
            <h3 class="text-[11px] font-black mb-6 uppercase text-orange-300 border-b border-orange-300/20 pb-2">Base de Canciones</h3>
            <div id="songs-editor-container"></div>
        </div>

        <div class="sticky bottom-0 bg-[#0d0d0d] pt-4 pb-8 border-t border-white/5">
            <button onclick="updateAndSaveConfig()" class="w-full bg-orange-600 py-4 text-xs font-black uppercase rounded shadow-2xl hover:bg-orange-500 transition-all">Sincronizar Todo</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        // CONFIGURACIÓN
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'innerspeaker-v2';
        const configDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'config', 'main');

        const OBJECT_MAP = {
            'Audífonos': { songs: ['Alter Ego', 'Solitude Is Bliss'] },
            'Espejo': { songs: ['Alter Ego', 'Expectation'] },
            'Ventana': { songs: ['Runway, Houses, City, Clouds', 'Lucidity'] },
            'Libreta': { songs: ['Why Won’t You Make Up Your Mind?', 'Expectation'] },
            'Silla': { songs: ['Jeremy\'s Storm', 'I Don\'t Really Mind'] },
            'Reloj': { songs: ['The Bold Arrow Of Time', 'Why Won’t You Make Up Your Mind?'] },
            'Lámpara': { songs: ['Lucidity', 'Desire Be Desire Go'] },
            'Vinilo': { songs: ['It Is Not Meant To Be', 'The Bold Arrow Of Time'] },
            'Cama': { songs: ['It Is Not Meant To Be', 'Desire Be Desire Go'] }
        };

        const TONAL_FAMILIES = {
            kind: ['Solitude Is Bliss', 'Lucidity', 'Runway, Houses, City, Clouds', 'I Don\'t Really Mind', 'Desire Be Desire Go'],
            critical: ['Alter Ego', 'Expectation', 'Why Won’t You Make Up Your Mind?', 'It Is Not Meant To Be', 'Jeremy\'s Storm', 'The Bold Arrow Of Time']
        };

        let user = null;
        let selected = [];
        let innerVoice = null;
        let unsubscribeSnapshot = null;

        // VALORES POR DEFECTO (Cargan instantáneamente)
        let currentConfig = {
            title: "INNERSPEAKER",
            subtitle: "TAME IMPALA",
            color1: "#c87c4a",
            color2: "#4b6a4a",
            bgVideo: "",
            bgImage: "",
            textAuthor: "Producido por André d'Lynae",
            textRoomInstr: "Selecciona 3 fragmentos de tu realidad",
            textResTag: "Vibración Resonante",
            textResetBtn: "Reiniciar Conciencia",
            songs: [
                { title: "It Is Not Meant To Be", tag: "Distancia", desc: "La sensación de que algo está fuera de tu alcance por naturaleza.", critique: "Aceptación de lo imposible.", url: "https://youtu.be/3a7jLiSCtfU" },
                { title: "Desire Be Desire Go", tag: "Movimiento", desc: "El deseo es una fuerza que fluye y se desvanece constantemente.", critique: "Fuga cerebral.", url: "https://youtu.be/L_u7IPrN2-8" },
                { title: "Alter Ego", tag: "Dualidad", desc: "La única persona que realmente puede cambiarte eres tú mismo.", critique: "Conversación interna.", url: "https://youtu.be/VpLXxFhy7s4" },
                { title: "Lucidity", tag: "Claridad", desc: "Momentos breves donde todo parece tener un sentido geométrico.", critique: "El despertar.", url: "https://youtu.be/fM_LIsA3vH8" },
                { title: "Why Won’t You Make Up Your Mind?", tag: "Indecisión", desc: "La parálisis que viene de analizar demasiado cada paso.", critique: "Bucle infinito.", url: "https://youtu.be/CwIV58Fk6GQ" },
                { title: "Solitude Is Bliss", tag: "Libertad", desc: "No hay nada más expansivo que la soledad por elección.", critique: "Independencia pura.", url: "https://youtu.be/N7eGu_p2jLk" },
                { title: "Jeremy's Storm", tag: "Caos", desc: "Una tormenta instrumental que limpia el ruido de la mente.", critique: "Limpieza sónica.", url: "https://youtu.be/kU_pLgPscvA" },
                { title: "Expectation", tag: "Ilusión", desc: "La brecha dolorosa entre lo que imaginamos y lo que ocurre.", critique: "Realismo psicodélico.", url: "https://youtu.be/i6Hm8SJF668" },
                { title: "The Bold Arrow Of Time", tag: "Blues", desc: "El tiempo avanza como una flecha pesada y distorsionada.", critique: "Anacronismo.", url: "https://youtu.be/S4pI6v_YQwI" },
                { title: "Runway, Houses, City, Clouds", tag: "Perspectiva", desc: "Mirar el mundo desde lo más alto para entender su pequeñez.", critique: "Viaje astral.", url: "https://youtu.be/t_uI-H09_f0" },
                { title: "I Don't Really Mind", tag: "Final", desc: "Al final del día, nada importa tanto como la calma.", critique: "Cierre de ciclo.", url: "https://youtu.be/q09R69Yf0Hk" }
            ]
        };

        // Renderizado inicial de la cuadrícula
        const grid = document.getElementById('objects-grid');
        Object.keys(OBJECT_MAP).forEach(obj => {
            const btn = document.createElement('button');
            btn.className = 'object-btn';
            btn.innerText = obj;
            btn.onclick = () => toggleObject(btn, obj);
            grid.appendChild(btn);
        });

        // Aplicar valores iniciales de inmediato
        applyConfig();

        // FLUJO DE FIREBASE
        onAuthStateChanged(auth, (u) => {
            user = u;
            if (u) {
                // Solo activamos la escucha una vez autenticados
                if (unsubscribeSnapshot) unsubscribeSnapshot();
                unsubscribeSnapshot = onSnapshot(configDocRef, (snap) => {
                    if (snap.exists()) {
                        currentConfig = { ...currentConfig, ...snap.data() };
                        applyConfig();
                        updateAdminForm();
                    }
                }, (error) => {
                    console.warn("Firestore en espera...");
                });
            }
        });

        // Autenticación silenciosa en segundo plano
        const silentAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else { 
                    await signInAnonymously(auth); 
                }
            } catch (e) { console.error("Silenced auth error", e); }
        };
        silentAuth();

        function applyConfig() {
            document.getElementById('editable-title').innerText = currentConfig.title;
            document.getElementById('editable-subtitle').innerText = currentConfig.subtitle;
            document.getElementById('status-text').innerText = currentConfig.textAuthor;
            
            const bgLayer = document.getElementById('dynamic-bg');
            const videoEl = document.getElementById('bg-video');

            if (currentConfig.bgVideo) {
                videoEl.src = currentConfig.bgVideo;
                videoEl.style.opacity = "1";
                bgLayer.style.opacity = "0.3";
            } else {
                videoEl.style.opacity = "0";
                bgLayer.style.opacity = "1";
            }

            if (currentConfig.bgImage) {
                bgLayer.style.backgroundImage = `url(${currentConfig.bgImage})`;
            } else {
                bgLayer.style.backgroundImage = "none";
                bgLayer.style.background = `radial-gradient(circle at 50% 100%, ${currentConfig.color1} -20%, ${currentConfig.color2} 40%, var(--bg-deep) 90%)`;
            }
        }

        function updateAdminForm() {
            document.getElementById('admin-title').value = currentConfig.title;
            document.getElementById('admin-subtitle').value = currentConfig.subtitle;
            document.getElementById('admin-c1').value = currentConfig.color1;
            document.getElementById('admin-c2').value = currentConfig.color2;
            document.getElementById('admin-video').value = currentConfig.bgVideo || "";
            document.getElementById('admin-bg-img').value = currentConfig.bgImage || "";

            const songContainer = document.getElementById('songs-editor-container');
            songContainer.innerHTML = '';
            currentConfig.songs.forEach((song, idx) => {
                const card = document.createElement('div');
                card.className = 'song-editor-card';
                card.innerHTML = `
                    <label>#${idx + 1} TRACK TITLE</label>
                    <input type="text" data-idx="${idx}" data-field="title" value="${song.title}" class="admin-input song-field">
                    <label>YOUTUBE URL</label>
                    <input type="text" data-idx="${idx}" data-field="url" value="${song.url}" class="admin-input song-field">
                    <label>DESCRIPCIÓN</label>
                    <textarea data-idx="${idx}" data-field="desc" class="admin-input song-field h-16">${song.desc}</textarea>
                    <label>CRÍTICA</label>
                    <input type="text" data-idx="${idx}" data-field="critique" value="${song.critique}" class="admin-input song-field">
                `;
                songContainer.appendChild(card);
            });
        }

        window.updateAndSaveConfig = async () => {
            if (!user) {
                alert("Conectando con el servidor... Inténtalo de nuevo.");
                silentAuth();
                return;
            }
            const songInputs = document.querySelectorAll('.song-field');
            const updatedSongs = [...currentConfig.songs];
            songInputs.forEach(input => {
                const idx = input.getAttribute('data-idx');
                const field = input.getAttribute('data-field');
                updatedSongs[idx][field] = input.value;
            });

            const newConfig = {
                title: document.getElementById('admin-title').value,
                subtitle: document.getElementById('admin-subtitle').value,
                color1: document.getElementById('admin-c1').value,
                color2: document.getElementById('admin-c2').value,
                bgVideo: document.getElementById('admin-video').value,
                bgImage: document.getElementById('admin-bg-img').value,
                textAuthor: "Producido por André d'Lynae",
                textRoomInstr: currentConfig.textRoomInstr,
                textResTag: currentConfig.textResTag,
                textResetBtn: currentConfig.textResetBtn,
                songs: updatedSongs
            };

            try {
                await setDoc(configDocRef, newConfig);
                alert("Cambios guardados exitosamente.");
                closeAdmin();
            } catch (e) { alert("Permiso denegado: " + e.message); }
        };

        window.toggleObject = (btn, name) => {
            if (selected.includes(name)) {
                selected = selected.filter(n => n !== name);
                btn.classList.remove('selected');
            } else if (selected.length < 3) {
                selected.push(name);
                btn.classList.add('selected');
            }
            if (selected.length === 3) setTimeout(() => goTo('voice'), 400);
        };

        window.setVoice = (v) => {
            innerVoice = v;
            goTo('loading');
            setTimeout(() => showResult(), 2000);
        };

        function showResult() {
            const firstObj = selected[0];
            const baseSongs = OBJECT_MAP[firstObj].songs;
            let candidateTitle = baseSongs[Math.floor(Math.random() * baseSongs.length)];
            if (!TONAL_FAMILIES[innerVoice].includes(candidateTitle)) {
                candidateTitle = TONAL_FAMILIES[innerVoice][Math.floor(Math.random() * TONAL_FAMILIES[innerVoice].length)];
            }
            const result = currentConfig.songs.find(s => s.title === candidateTitle) || currentConfig.songs[0];
            document.getElementById('res-title').innerText = result.title;
            document.getElementById('res-desc').innerText = result.desc;
            document.getElementById('res-critique').innerText = result.critique;
            document.getElementById('res-link').href = result.url;
            goTo('result');
        }

        window.goTo = (id) => {
            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('active');
                s.style.display = 'none';
            });
            const next = document.getElementById(`screen-${id}`);
            next.style.display = 'flex';
            setTimeout(() => next.classList.add('active'), 50);
        };

        function createTree() {
            const container = document.getElementById('trees-container');
            const tree = document.createElement('div');
            tree.className = 'tree';
            tree.innerHTML = `<svg viewBox="0 0 100 100"><path d="M50 10 L85 85 L15 85 Z" fill="currentColor"/><rect x="45" y="85" width="10" height="15" fill="currentColor"/></svg>`;
            tree.style.left = `${Math.random() * 100}%`;
            tree.style.top = `${Math.random() * 80}%`;
            tree.style.animation = `zoomTree ${25 + Math.random() * 15}s linear ${Math.random() * 10}s infinite`;
            container.appendChild(tree);
        }
        for(let i=0; i<12; i++) createTree();

        window.openLogin = () => {
            const u = prompt("Usuario de edición:");
            const p = prompt("Contraseña:");
            if(u === 'asaehvi' && p === 'notasdazul') {
                document.getElementById('admin-panel').classList.add('open');
            } else {
                alert("Acceso denegado.");
            }
        };
        window.closeAdmin = () => document.getElementById('admin-panel').classList.remove('open');
    </script>
</body>
</html>
