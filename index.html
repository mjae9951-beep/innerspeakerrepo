<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innerspeaker Experience - Pro Branding Edition</title>
    
    <!-- Scripts Base -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: #000; color: white; overflow-x: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }
        
        .bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        .bg-image {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        .admin-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 0.6rem;
            border-radius: 0.4rem;
            width: 100%;
            font-size: 0.8rem;
            transition: border 0.2s;
        }
        .admin-input:focus { border-color: #fbbf24; outline: none; }

        .analysis-card {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCXcM54HHeambvpHkJY1-N1G3Q7UPcPOj8",
            authDomain: "innerspeaker-568f3.firebaseapp.com",
            projectId: "innerspeaker-568f3",
            storageBucket: "innerspeaker-568f3.firebasestorage.app",
            messagingSenderId: "945238998266",
            appId: "1:945238998266:web:661d0080b0d42cb7a59d43"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const apiKey = ""; // Gemini API Key
        const APP_DOC_ID = "innerspeaker-v1";
        const ADMIN_PASSWORD = "raiden";

        const DEFAULT_CONFIG = {
            appearance: {
                backgroundType: 'color', // 'color', 'image', 'video'
                backgroundUrl: '',
                bgColor: '#0b0f1a',
                textColor: '#f8fafc',
                accentColor: '#fbbf24',
                overlayOpacity: 0.5
            },
            texts: {
                welcomeTitle: "Innerspeaker",
                welcomeSubtitle: "Una exploración lírica sobre tu momento actual",
                welcomeButton: "Comenzar exploración",
                selectionTitle: "Selecciona 3 elementos que capten tu atención",
                voiceTitle: "¿Cómo describirías tu estado mental hoy?",
                voiceAmable: "En calma / Reflexivo",
                voiceCritica: "Inquieto / Analítico",
                revealTitle: "Tu resonancia lírica es:",
                youtubeButton: "Escuchar canción",
                loadingText: "Interpretando líricas..."
            },
            objects: [
                { id: 1, name: "Cámara Analógica", song: "It Is Not Meant to Be", url: "https://www.youtube.com/watch?v=b0S6I0C2m-o", amablePct: 85 },
                { id: 2, name: "Prisma de Cristal", song: "Desire Be Desire Go", url: "https://www.youtube.com/watch?v=W-LpYtQY2pU", amablePct: 40 },
                { id: 3, name: "Hojas Secas", song: "Alter Ego", url: "https://www.youtube.com/watch?v=bBSropdYUtw", amablePct: 75 },
                { id: 4, name: "Cinta de Cassette", song: "Lucidity", url: "https://www.youtube.com/watch?v=AdBlnmD7Ios", amablePct: 60 },
                { id: 5, name: "Nube de Humo", song: "Why Won't You Make Up Your Mind?", url: "https://www.youtube.com/watch?v=mD9vUofHeYc", amablePct: 30 },
                { id: 6, name: "Espejo Roto", song: "Solitude Is Bliss", url: "https://www.youtube.com/watch?v=vxvf7gR4-2w", amablePct: 15 },
                { id: 7, name: "Arena Movediza", song: "Jeremy's Storm", url: "https://www.youtube.com/watch?v=0wL0M4tI0Lg", amablePct: 50 },
                { id: 8, name: "Luz de Neón", song: "Expectation", url: "https://www.youtube.com/watch?v=i9vVlO-H9nE", amablePct: 25 },
                { id: 9, name: "Ojo Infinito", song: "The Bold Arrow of Time", url: "https://www.youtube.com/watch?v=A2C6N8TndH8", amablePct: 10 },
                { id: 10, name: "Cúpula de Vidrio", song: "Runway, Houses, City, Clouds", url: "https://www.youtube.com/watch?v=NInW_u_rX_I", amablePct: 95 },
                { id: 11, name: "Eco de Montaña", song: "I Don't Really Mind", url: "https://www.youtube.com/watch?v=m9_Lid6hC54", amablePct: 65 }
            ]
        };

        async function callGemini(prompt, systemPrompt) {
            let retries = 0;
            const delay = (ms) => new Promise(res => setTimeout(res, ms));
            while (retries < 5) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "...";
                } catch (err) { retries++; await delay(Math.pow(2, retries) * 1000); }
            }
            return "Error al conectar con la IA.";
        }

        const Icon = ({ name, size = 24, className = "" }) => {
            React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        function App() {
            const [user, setUser] = React.useState(null);
            const [screen, setScreen] = React.useState('home');
            const [config, setConfig] = React.useState(DEFAULT_CONFIG);
            const [selectedObjects, setSelectedObjects] = React.useState([]);
            const [voiceType, setVoiceType] = React.useState(null);
            const [isAdminMode, setIsAdminMode] = React.useState(false);
            const [adminPass, setAdminPass] = React.useState("");
            const [isAuthenticated, setIsAuthenticated] = React.useState(false);
            
            const [aiAnalysis, setAiAnalysis] = React.useState("");
            const [isAiLoading, setIsAiLoading] = React.useState(false);

            React.useEffect(() => {
                signInAnonymously(auth);
                onAuthStateChanged(auth, u => setUser(u));
            }, []);

            React.useEffect(() => {
                if (!user) return;
                const configRef = doc(db, 'artifacts', APP_DOC_ID, 'public', 'config');
                return onSnapshot(configRef, (snap) => {
                    if (snap.exists()) setConfig(snap.data());
                    else setDoc(configRef, DEFAULT_CONFIG);
                });
            }, [user]);

            React.useEffect(() => {
                if (screen === 'loading-reveal') {
                    const timer = setTimeout(() => {
                        generateLyricAnalysis();
                        setScreen('reveal');
                    }, 2000);
                    return () => clearTimeout(timer);
                }
            }, [screen]);

            const generateLyricAnalysis = async () => {
                setIsAiLoading(true);
                const result = getResult();
                const systemPrompt = "Eres un analista de música y fan de Tame Impala. Explica la letra de la canción y por qué encaja con el usuario sin usar lenguaje técnico o místico.";
                const prompt = `Analiza la canción "${result.song}". El usuario eligió los objetos "${selectedObjects.map(o=>o.name).join(', ')}" y se siente "${voiceType === 'amable' ? 'tranquilo' : 'inquieto'}". Explica la letra brevemente y cómo ayuda su mensaje. 60 palabras max.`;
                const response = await callGemini(prompt, systemPrompt);
                setAiAnalysis(response);
                setIsAiLoading(false);
            };

            const getResult = () => {
                const avg = selectedObjects.reduce((a, b) => a + b.amablePct, 0) / 3;
                const score = voiceType === 'amable' ? avg + 12 : avg - 12;
                return config.objects.reduce((prev, curr) => 
                    Math.abs(curr.amablePct - score) < Math.abs(prev.amablePct - score) ? curr : prev
                );
            };

            const handleUpdateConfig = async (e) => {
                e.preventDefault();
                await updateDoc(doc(db, 'artifacts', APP_DOC_ID, 'public', 'config'), config);
                setIsAdminMode(false);
            };

            const Background = () => {
                if (config.appearance.backgroundType === 'video' && config.appearance.backgroundUrl) {
                    return <video autoPlay muted loop playsInline className="bg-video"><source src={config.appearance.backgroundUrl} type="video/mp4" /></video>;
                }
                if (config.appearance.backgroundType === 'image' && config.appearance.backgroundUrl) {
                    return <div className="bg-image" style={{ backgroundImage: `url(${config.appearance.backgroundUrl})` }} />;
                }
                return <div className="bg-image" style={{ backgroundColor: config.appearance.bgColor }} />;
            };

            const ScreenWrapper = ({ children, className = "" }) => (
                <div className="min-h-screen w-full flex flex-col items-center justify-center p-6 relative overflow-hidden" style={{ color: config.appearance.textColor }}>
                    <Background />
                    <div className="absolute inset-0 z-0 pointer-events-none" style={{ backgroundColor: config.appearance.backgroundType === 'color' ? 'transparent' : `rgba(0,0,0,${config.appearance.overlayOpacity})` }} />
                    <div className={`z-10 w-full max-w-4xl flex flex-col items-center animate-fade-in ${className}`}>
                        {children}
                    </div>
                    <button onClick={() => setIsAdminMode(true)} className="fixed bottom-4 right-4 p-2 opacity-10 hover:opacity-100 z-50"><Icon name="settings" size={14}/></button>
                </div>
            );

            if (isAdminMode) return (
                <div className="fixed inset-0 z-[100] bg-black flex items-center justify-center p-4">
                    <div className="w-full max-w-2xl bg-[#0a0a0a] border border-white/10 rounded-2xl p-6 md:p-10 max-h-[90vh] overflow-y-auto custom-scrollbar">
                        {!isAuthenticated ? (
                            <div className="space-y-6 text-center">
                                <h2 className="text-xl font-black uppercase tracking-widest">Admin Access</h2>
                                <input type="password" placeholder="Password" className="admin-input text-center" value={adminPass} onChange={e => setAdminPass(e.target.value)} onKeyDown={e => e.key === 'Enter' && adminPass === ADMIN_PASSWORD && setIsAuthenticated(true)}/>
                                <button onClick={() => adminPass === ADMIN_PASSWORD && setIsAuthenticated(true)} className="w-full py-3 bg-white text-black font-bold uppercase text-xs">Login</button>
                                <button onClick={() => setIsAdminMode(false)} className="text-[10px] opacity-30">Cerrar</button>
                            </div>
                        ) : (
                            <form onSubmit={handleUpdateConfig} className="space-y-8">
                                <div className="flex justify-between items-center sticky top-0 bg-[#0a0a0a] py-4 z-10 border-b border-white/10">
                                    <h2 className="text-xl font-black uppercase tracking-widest text-amber-500">Editor de Branding</h2>
                                    <button type="submit" className="px-6 py-2 bg-amber-500 text-black font-bold text-xs uppercase">Guardar Todo</button>
                                </div>

                                {/* Multimedia */}
                                <section className="space-y-4">
                                    <h3 className="text-xs font-bold uppercase opacity-50 border-l-2 border-amber-500 pl-2">Multimedia de Fondo</h3>
                                    <select className="admin-input" value={config.appearance.backgroundType} onChange={e => setConfig({...config, appearance: {...config.appearance, backgroundType: e.target.value}})}>
                                        <option value="color">Color Sólido</option>
                                        <option value="image">Imagen HD (Link)</option>
                                        <option value="video">Video 4K / MP4 (Link)</option>
                                    </select>
                                    {config.appearance.backgroundType !== 'color' && (
                                        <input className="admin-input" placeholder="URL del archivo (Direct Link)" value={config.appearance.backgroundUrl} onChange={e => setConfig({...config, appearance: {...config.appearance, backgroundUrl: e.target.value}})} />
                                    )}
                                    <div className="flex items-center gap-4">
                                        <label className="text-[10px] uppercase">Opacidad Overlay:</label>
                                        <input type="range" min="0" max="1" step="0.1" value={config.appearance.overlayOpacity} onChange={e => setConfig({...config, appearance: {...config.appearance, overlayOpacity: parseFloat(e.target.value)}})} />
                                    </div>
                                </section>

                                {/* Textos */}
                                <section className="space-y-4">
                                    <h3 className="text-xs font-bold uppercase opacity-50 border-l-2 border-amber-500 pl-2">Textos Globales</h3>
                                    {Object.keys(config.texts).map(key => (
                                        <div key={key}>
                                            <label className="text-[9px] uppercase opacity-40">{key}</label>
                                            <input className="admin-input" value={config.texts[key]} onChange={e => setConfig({...config, texts: {...config.texts, [key]: e.target.value}})} />
                                        </div>
                                    ))}
                                </section>

                                {/* Canciones */}
                                <section className="space-y-4">
                                    <h3 className="text-xs font-bold uppercase opacity-50 border-l-2 border-amber-500 pl-2">Gestión de Canciones (11)</h3>
                                    <div className="space-y-6">
                                        {config.objects.map((obj, idx) => (
                                            <div key={obj.id} className="p-4 bg-white/5 rounded-lg border border-white/5 space-y-2">
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="text-[10px] font-bold text-amber-500">SLOT #{idx+1}</span>
                                                    <span className="text-[10px] opacity-30">ID: {obj.id}</span>
                                                </div>
                                                <input className="admin-input" placeholder="Nombre Elemento" value={obj.name} onChange={e => {
                                                    const newObjs = [...config.objects];
                                                    newObjs[idx].name = e.target.value;
                                                    setConfig({...config, objects: newObjs});
                                                }} />
                                                <input className="admin-input" placeholder="Título de Canción" value={obj.song} onChange={e => {
                                                    const newObjs = [...config.objects];
                                                    newObjs[idx].song = e.target.value;
                                                    setConfig({...config, objects: newObjs});
                                                }} />
                                                <input className="admin-input" placeholder="Enlace YouTube" value={obj.url} onChange={e => {
                                                    const newObjs = [...config.objects];
                                                    newObjs[idx].url = e.target.value;
                                                    setConfig({...config, objects: newObjs});
                                                }} />
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            </form>
                        )}
                    </div>
                </div>
            );

            if (screen === 'home') return (
                <ScreenWrapper>
                    <h1 className="text-6xl md:text-9xl font-black uppercase tracking-tighter text-center leading-[0.85]">{config.texts.welcomeTitle}</h1>
                    <p className="text-[10px] md:text-xs tracking-[0.4em] font-bold opacity-60 uppercase py-8 text-center">{config.texts.welcomeSubtitle}</p>
                    <button onClick={() => setScreen('selection')} className="px-12 py-5 bg-white text-black font-black text-xs uppercase tracking-widest hover:scale-105 transition-all">
                        {config.texts.welcomeButton}
                    </button>
                </ScreenWrapper>
            );

            if (screen === 'selection') return (
                <ScreenWrapper>
                    <h2 className="text-[10px] font-bold mb-10 uppercase tracking-widest opacity-50">{config.texts.selectionTitle}</h2>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-10 w-full max-h-[50vh] overflow-y-auto custom-scrollbar px-2">
                        {config.objects.map(obj => {
                            const sel = selectedObjects.find(o => o.id === obj.id);
                            return (
                                <button key={obj.id} onClick={() => {
                                    if(sel) setSelectedObjects(selectedObjects.filter(o => o.id !== obj.id));
                                    else if(selectedObjects.length < 3) setSelectedObjects([...selectedObjects, obj]);
                                }} className={`aspect-square border transition-all p-4 flex items-center justify-center text-center font-bold uppercase text-[9px] tracking-tighter ${sel ? 'border-white bg-white text-black' : 'border-white/10 bg-black/40 backdrop-blur-md hover:border-white/40'}`}>
                                    {obj.name}
                                </button>
                            );
                        })}
                    </div>
                    <button disabled={selectedObjects.length < 3} onClick={() => setScreen('voice')} className="px-12 py-4 border-2 border-white font-bold uppercase text-[10px] tracking-widest disabled:opacity-20 hover:bg-white hover:text-black transition-all">
                        Siguiente ({selectedObjects.length}/3)
                    </button>
                </ScreenWrapper>
            );

            if (screen === 'voice') return (
                <ScreenWrapper>
                    <h2 className="text-xl md:text-3xl font-black uppercase tracking-widest mb-12 text-center">{config.texts.voiceTitle}</h2>
                    <div className="flex flex-col gap-3 w-full max-w-sm">
                        <button onClick={() => { setVoiceType('amable'); setScreen('loading-reveal'); }} className="p-8 border border-white/20 bg-black/40 backdrop-blur-xl hover:bg-white hover:text-black transition-all font-black uppercase text-xs tracking-[0.2em]">
                            {config.texts.voiceAmable}
                        </button>
                        <button onClick={() => { setVoiceType('critica'); setScreen('loading-reveal'); }} className="p-8 border border-white/20 bg-black/40 backdrop-blur-xl hover:bg-white hover:text-black transition-all font-black uppercase text-xs tracking-[0.2em]">
                            {config.texts.voiceCritica}
                        </button>
                    </div>
                </ScreenWrapper>
            );

            if (screen === 'loading-reveal') return (
                <ScreenWrapper>
                    <div className="w-12 h-12 border-4 border-white/10 border-t-white rounded-full animate-spin mb-6" />
                    <p className="text-[10px] font-bold uppercase tracking-[0.4em] opacity-40">{config.texts.loadingText}</p>
                </ScreenWrapper>
            );

            if (screen === 'reveal') {
                const res = getResult();
                return (
                    <ScreenWrapper>
                        <div className="text-center w-full space-y-12 max-w-2xl">
                            <div>
                                <h3 className="text-[10px] font-bold uppercase tracking-[0.6em] opacity-50 mb-6">{config.texts.revealTitle}</h3>
                                <h2 className="text-5xl md:text-8xl font-black uppercase tracking-tighter leading-none border-y border-white/10 py-8">{res.song}</h2>
                            </div>

                            <div className="analysis-card p-10 text-left animate-fade-in" style={{ animationDelay: '0.2s' }}>
                                {isAiLoading ? <div className="animate-pulse space-y-3"><div className="h-2 bg-white/10 w-full rounded"/><div className="h-2 bg-white/10 w-4/5 rounded"/></div> : (
                                    <p className="text-sm md:text-base font-medium leading-relaxed opacity-80 italic">
                                        "{aiAnalysis}"
                                    </p>
                                )}
                            </div>

                            <div className="flex flex-col md:flex-row gap-6 justify-center items-center">
                                <a href={res.url} target="_blank" className="w-full md:w-auto px-10 py-5 bg-white text-black font-black uppercase text-xs tracking-widest flex items-center justify-center gap-3">
                                    <Icon name="play" size={14} fill="currentColor" /> {config.texts.youtubeButton}
                                </a>
                                <button onClick={() => { setScreen('home'); setSelectedObjects([]); setVoiceType(null); }} className="text-[10px] uppercase font-bold opacity-30 hover:opacity-100 transition-opacity">
                                    Repetir exploración
                                </button>
                            </div>
                        </div>
                    </ScreenWrapper>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
