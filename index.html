<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Innerspeaker - Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Permanent+Marker&family=Inter:wght@200;300;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0d1b1a; 
            --sky-blue: #2a93b8; 
            --leaf-green: #4b6a4a;
            --autumn-orange: #c87c4a;
            --text-off: #e8e4d9;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-deep);
            color: var(--text-off);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .grain {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.15; pointer-events: none; z-index: 50;
        }

        .bg-layer {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 100%, var(--autumn-orange) -20%, var(--leaf-green) 40%, var(--bg-deep) 90%);
            z-index: -2;
        }

        .tree {
            position: absolute;
            width: 150px; height: 150px;
            color: rgba(20, 40, 30, 0.6);
            transform-origin: center;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes zoomTree {
            0% { transform: scale(0.1) rotate(0deg); opacity: 0; }
            15% { opacity: 0.8; }
            85% { opacity: 0.8; }
            100% { transform: scale(4) rotate(15deg); opacity: 0; }
        }

        .screen {
            display: none;
            position: absolute;
            inset: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .screen.active { display: flex; opacity: 1; }

        .object-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem;
            transition: all 0.3s;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .object-btn.selected {
            background: var(--autumn-orange);
            color: white;
            border-color: var(--autumn-orange);
            transform: scale(0.95);
        }

        .voice-btn {
            font-family: 'Permanent Marker', cursive;
            font-size: 2.5rem;
            transition: color 0.3s;
        }

        .voice-btn:hover { color: var(--autumn-orange); }

        .typewriter { font-family: 'Special Elite', serif; }

        .btn-main {
            border: 1px solid var(--text-off);
            padding: 0.75rem 2.5rem;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 0.2em;
            font-size: 0.8rem;
            transition: all 0.3s;
        }

        .btn-main:hover {
            background: var(--text-off);
            color: var(--bg-deep);
        }
    </style>
</head>
<body>

    <div class="grain"></div>
    <div class="bg-layer"></div>
    <div id="trees-container"></div>

    <!-- PANTALLA 1: LANDING -->
    <div id="screen-landing" class="screen active">
        <h1 class="text-6xl sm:text-8xl font-black tracking-tighter mb-4">INNERSPEAKER</h1>
        <p class="typewriter text-xs opacity-50 mb-12 uppercase tracking-[0.4em]">Subconsciente Digital v2.5</p>
        <button onclick="goTo('room')" id="btn-start" class="btn-main opacity-40 pointer-events-none">Iniciando...</button>
        <p id="status-text" class="text-[9px] mt-6 uppercase opacity-40">Estableciendo resonancia con la nube...</p>
    </div>

    <!-- PANTALLA 2: CUARTO -->
    <div id="screen-room" class="screen">
        <h2 class="text-[10px] font-black uppercase tracking-[0.3em] mb-8 opacity-40">Paso 01 / Percepción del entorno</h2>
        <div class="grid grid-cols-3 gap-3 w-full max-w-sm">
            <button class="object-btn" onclick="toggleObject(this, 'Espejo')">Espejo</button>
            <button class="object-btn" onclick="toggleObject(this, 'Ventana')">Ventana</button>
            <button class="object-btn" onclick="toggleObject(this, 'Libreta')">Libreta</button>
            <button class="object-btn" onclick="toggleObject(this, 'Silla')">Silla</button>
            <button class="object-btn" onclick="toggleObject(this, 'Reloj')">Reloj</button>
            <button class="object-btn" onclick="toggleObject(this, 'Lámpara')">Lámpara</button>
            <button class="object-btn" onclick="toggleObject(this, 'Cámara')">Cámara</button>
            <button class="object-btn" onclick="toggleObject(this, 'Vinilo')">Vinilo</button>
            <button class="object-btn" onclick="toggleObject(this, 'Planta')">Planta</button>
        </div>
        <p class="mt-8 text-[10px] opacity-40 uppercase">Selecciona 3 fragmentos de tu realidad</p>
    </div>

    <!-- PANTALLA 3: VOZ -->
    <div id="screen-voice" class="screen">
        <h2 class="text-[10px] font-black uppercase tracking-[0.3em] mb-12 opacity-40">Paso 02 / La Voz Interior</h2>
        <div class="flex flex-col gap-8">
            <button onclick="setVoice('kind')" class="voice-btn">Amable</button>
            <div class="h-[1px] bg-white/10 w-32 mx-auto"></div>
            <button onclick="setVoice('critical')" class="voice-btn">Crítica</button>
        </div>
    </div>

    <!-- PANTALLA 4: CARGA -->
    <div id="screen-loading" class="screen">
        <div class="w-16 h-16 border-2 border-white/20 border-t-white rounded-full animate-spin mb-6"></div>
        <p id="loading-msg" class="typewriter text-xs uppercase tracking-widest animate-pulse">Analizando...</p>
    </div>

    <!-- PANTALLA 5: RESULTADO -->
    <div id="screen-result" class="screen">
        <div class="max-w-md">
            <h3 id="res-title" class="text-4xl sm:text-5xl font-black uppercase tracking-tighter mb-4"></h3>
            <p id="res-tag" class="text-[10px] font-bold text-orange-400 uppercase tracking-widest mb-6"></p>
            <div class="h-[1px] bg-white/20 w-full mb-6"></div>
            <p id="res-desc" class="typewriter text-sm leading-relaxed mb-6"></p>
            <p id="res-critique" class="typewriter text-xs italic opacity-40 mb-12"></p>
            
            <div class="flex flex-col sm:flex-row gap-4 items-center justify-center">
                <a id="res-link" href="#" target="_blank" class="btn-main">Escuchar</a>
                <button onclick="location.reload()" class="text-[9px] uppercase font-black opacity-30 hover:opacity-100 transition-opacity">Reiniciar Experiencia</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { 
            getFirestore, doc, setDoc, onSnapshot, 
            initializeFirestore, persistentLocalCache, persistentMultipleTabManager 
        } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCXcM54HHeambvpHkJY1-N1G3Q7UPcPOj8",
            authDomain: "innerspeaker-568f3.firebaseapp.com",
            projectId: "innerspeaker-568f3",
            storageBucket: "innerspeaker-568f3.firebasestorage.app",
            messagingSenderId: "945238998266",
            appId: "1:945238998266:web:661d0080b0d42cb7a59d43"
        };

        const app = initializeApp(firebaseConfig);
        const db = initializeFirestore(app, {
            localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
        });
        const auth = getAuth(app);
        const appId = 'innerspeaker-v2-prod';

        let user = null;
        let selected = [];
        let innerVoice = null;

        // BASE DE DATOS COMPLETA: 11 CANCIONES
        const songDatabase = {
            kind: [
                { title: "Solitude Is Bliss", tag: "Independencia", desc: "No hay nada malo en estar solo. Tu realidad es un santuario construido por ti.", critique: "Tu mente te susurra que el mundo puede esperar.", url: "https://youtu.be/N7eGu_p2jLk" },
                { title: "Alter Ego", tag: "Dualidad", desc: "Estás en el borde de algo nuevo. Esa extrañeza es el sonido de tu crecimiento.", critique: "Es momento de dejar que esa otra versión de ti tome el control.", url: "https://youtu.be/VpLXxFhy7s4" },
                { title: "Lucidity", tag: "Claridad", desc: "A veces el camino más claro es el que más vueltas da.", critique: "Has encontrado el hilo, no lo sueltes ahora.", url: "https://youtu.be/S_3S-idN298" },
                { title: "Jeremy's Storm", tag: "Pausa Instrumental", desc: "No se necesitan palabras cuando el caos tiene su propio ritmo.", critique: "Estás en el ojo del huracán, disfrutando la calma.", url: "https://youtu.be/p667R9pP5r8" },
                { title: "The Bold Arrow of Time", tag: "Legado", desc: "El tiempo se mueve hacia adelante, pero tú puedes elegir qué llevar contigo.", critique: "Tu confianza es una flecha que atraviesa la incertidumbre.", url: "https://youtu.be/39O2l0H_7yU" },
                { title: "Runway, Houses, City, Clouds", tag: "Perspectiva", desc: "Mirar desde arriba hace que todo parezca más simple, más hermoso.", critique: "Estás listo para despegar, deja el peso atrás.", url: "https://youtu.be/fM1mX2o-p-0" }
            ],
            critical: [
                { title: "It Is Not Meant To Be", tag: "Aceptación", desc: "A veces las cosas simplemente no encajan. Y eso está bien.", critique: "Deja de forzar lo que el destino ya soltó.", url: "https://youtu.be/3a7jLiSCtfU" },
                { title: "Expectation", tag: "Realidad", desc: "La distancia entre lo que quieres y lo que tienes es donde vive tu música.", critique: "Tus expectativas son las paredes de tu propia celda.", url: "https://youtu.be/i6Hm8SXcFi8" },
                { title: "Why Won't You Make Up Your Mind?", tag: "Indecisión", desc: "La duda no es el final, es el motor que te mantiene buscando.", critique: "Tus preguntas son más honestas que tus respuestas.", url: "https://youtu.be/CwIV58Fk6GQ" },
                { title: "Desire Be, Desire Go", tag: "Impermanencia", desc: "El deseo llega y se va como una marea. No te aferres a lo que fluye.", critique: "Déjalo ir antes de que se convierta en una carga.", url: "https://youtu.be/fM1mX2o-p-0" },
                { title: "I Don't Really Mind", tag: "Indiferencia", desc: "Cuando dejas de preocuparte, el universo empieza a conspirar a tu favor.", critique: "Tu libertad nace en el momento en que dejas de buscar aprobación.", url: "https://youtu.be/0HwS8N_m77U" }
            ]
        };

        window.goTo = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            setTimeout(() => {
                document.getElementById(`screen-${id}`).classList.add('active');
            }, 50);
        };

        function createTree() {
            const container = document.getElementById('trees-container');
            const tree = document.createElement('div');
            tree.className = 'tree';
            tree.innerHTML = `
                <svg viewBox="0 0 100 100">
                    <path d="M50 10 L85 85 L15 85 Z" fill="currentColor" />
                    <rect x="45" y="85" width="10" height="15" fill="currentColor" />
                </svg>
            `;
            const x = 10 + Math.random() * 80;
            const y = 10 + Math.random() * 60;
            const duration = 15 + Math.random() * 10;
            const delay = Math.random() * 5;
            tree.style.left = `${x}%`;
            tree.style.top = `${y}%`;
            tree.style.animation = `zoomTree ${duration}s linear ${delay}s infinite`;
            container.appendChild(tree);
        }

        for(let i=0; i<12; i++) createTree();

        onAuthStateChanged(auth, (u) => {
            if (u) {
                user = u;
                document.getElementById('status-text').innerText = "Conexión estable.";
                const btn = document.getElementById('btn-start');
                btn.innerText = "ENTRAR";
                btn.classList.remove('opacity-40', 'pointer-events-none');
                loadUserData();
            }
        });

        signInAnonymously(auth).catch(() => {
            document.getElementById('status-text').innerText = "Modo offline.";
            document.getElementById('btn-start').classList.remove('opacity-40', 'pointer-events-none');
        });

        function loadUserData() {
            if (!user) return;
            const userDoc = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'state');
            onSnapshot(userDoc, (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    selected = data.selected || [];
                    innerVoice = data.innerVoice || null;
                    syncUI();
                }
            });
        }

        async function saveState() {
            if (!user) return;
            const userDoc = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'state');
            await setDoc(userDoc, { selected, innerVoice, lastUpdate: Date.now() });
        }

        window.toggleObject = async (btn, name) => {
            if (selected.includes(name)) {
                selected = selected.filter(n => n !== name);
            } else if (selected.length < 3) {
                selected.push(name);
            }
            syncUI();
            await saveState();
            if (selected.length === 3) {
                setTimeout(() => goTo('voice'), 800);
            }
        };

        window.setVoice = async (v) => {
            innerVoice = v;
            await saveState();
            goTo('loading');
            
            const msgs = ["Sintonizando...", "Alineando ecos...", "Procesando subconsciente..."];
            let i = 0;
            const interval = setInterval(() => {
                document.getElementById('loading-msg').innerText = msgs[i++ % msgs.length];
            }, 700);

            setTimeout(() => {
                clearInterval(interval);
                showResult();
            }, 2500);
        };

        function syncUI() {
            document.querySelectorAll('.object-btn').forEach(btn => {
                btn.classList.toggle('selected', selected.includes(btn.innerText));
            });
        }

        function showResult() {
            const pool = songDatabase[innerVoice] || songDatabase.kind;
            // Cálculo basado en la longitud combinada de los objetos seleccionados para variar el resultado
            const weight = selected.reduce((acc, name) => acc + name.length, 0);
            const index = weight % pool.length;
            const result = pool[index];

            document.getElementById('res-title').innerText = result.title;
            document.getElementById('res-tag').innerText = result.tag;
            document.getElementById('res-desc').innerText = result.desc;
            document.getElementById('res-critique').innerText = result.critique;
            document.getElementById('res-link').href = result.url;
            
            goTo('result');
        }
    </script>
</body>
</html>
